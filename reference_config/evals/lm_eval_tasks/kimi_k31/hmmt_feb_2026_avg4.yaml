# HMMT February 2026 avg@4 for Kimi-K3.1: the K2-Horizon task (../k2_horizon/hmmt_feb_2026_avg4.yaml, which explains the avg@4 setup), with the same
# dataset, prompt, generation settings and metrics. Only the grader differs: utils.py's,
# which adds the right-hand side of a boxed equation to what the fork's grader accepts.
task: k2_hmmt_feb_2026_avg4
dataset_path: MathArena/hmmt_feb_2026
test_split: train
output_type: generate_until
# MathArena's instruction for answer-extracted math problems.
doc_to_text: "{{problem}}\n\nPlease reason step by step, and put your final answer within \\boxed{}."
doc_to_target: "{{answer}}"
process_results: !function utils.process_results_math_avg
repeats: 4
# Keep all 4 sampled answers; lm-eval's default filter would keep only the first.
filter_list:
  - name: none
    filter:
      - function: take_first_k
        k: 4
num_fewshot: 0
generation_kwargs:
  until: []
  do_sample: true
  temperature: 1.0
  top_p: 0.95
  max_gen_toks: 65536
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
