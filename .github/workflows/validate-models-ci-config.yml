name: Validate Models CI Config

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/models-ci-config.json"
      - ".github/workflows/models-ci-config-schema.json"
      - "scripts/validate_models_ci_config.py"

jobs:
  validate:
    name: Validate models-ci-config.json
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate against schema
        run: python scripts/validate_models_ci_config.py
