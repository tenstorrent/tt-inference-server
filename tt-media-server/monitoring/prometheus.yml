global:
  scrape_interval: 5s
  evaluation_interval: 5s

  # Identity of THIS deployment, stamped onto every series on remote_write.
  #
  # Without it these metrics cannot be aggregated across hosts. The per-job
  # `instance` labels below name which PROCESS in one stack a series came from
  # (regular / prefill / decode / gateway / host) — they are identical on every
  # box, deliberately, because the dashboards filter on `role` and `service`.
  # That is fine for a single-host view and collides the moment two deployments
  # ship to one store: every host claims instance="tt_media_server", so
  # sum()/max() across the fleet reads one series instead of N and skew across
  # instances cannot be computed at all.
  #
  # Set DEPLOYMENT_NAME to something stable and unique per deployment (a site
  # or cluster name, NOT the container hostname — that is the container id and
  # changes on every restart, which would mint a new series each time).
  # Left empty for a local-only stack: Prometheus treats an empty label value
  # as absent. Enabling REMOTE_WRITE_URL without setting this is refused at
  # startup rather than silently shipping colliding series.
  external_labels:
    deployment: "__DEPLOYMENT_NAME__"

# Recording + alerting rules. Matched glob; safe when the directory is empty
# or absent (Prometheus logs a notice but keeps running).
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # --- Single-server (LLM_MODE=regular) ----------------------------------
  # TARGET and SERVICE are substituted at container startup by docker-compose
  # (sed). Set SERVER_TARGET=<container-name>:<port> and SERVER_SERVICE=<name>
  # (e.g. "python" or "cpp") when running docker compose. SERVER_SERVICE
  # defaults to "python" for backwards compatibility with the original setup.
  #
  # Every series gets role="regular" so the regular dashboard can coexist with
  # the disaggregated prefill/decode targets below without double-counting.
  - job_name: "tt_media_server"
    static_configs:
      - targets:
          - "__SERVER_TARGET__"
        labels:
          instance: "tt_media_server"
          service: "__SERVER_SERVICE__"
          language: "__SERVER_SERVICE__"
          role: "regular"
    metrics_path: /metrics
    scheme: http
    scrape_timeout: 4s

  # --- Disaggregated prefill/decode (LLM_MODE=prefill | decode) ----------
  # The two C++ servers expose IDENTICAL metric names, so they are told apart
  # purely by the role label below. The prefill/decode Grafana dashboards each
  # filter on role={"prefill"|"decode"}. When a target is not running (e.g.
  # single-server mode) Prometheus marks it down and emits no series, so these
  # jobs are harmless to leave configured.
  #
  # Set PREFILL_TARGET / DECODE_TARGET to <container-name>:<port>.
  - job_name: "tt_media_server_prefill"
    static_configs:
      - targets:
          - "__PREFILL_TARGET__"
        labels:
          instance: "tt_media_server_prefill"
          service: "cpp"
          language: "cpp"
          role: "prefill"
    metrics_path: /metrics
    scheme: http
    scrape_timeout: 4s

  - job_name: "tt_media_server_decode"
    static_configs:
      - targets:
          - "__DECODE_TARGET__"
        labels:
          instance: "tt_media_server_decode"
          service: "cpp"
          language: "cpp"
          role: "decode"
    metrics_path: /metrics
    scheme: http
    scrape_timeout: 4s

  - job_name: "tt_prefill_gateway"
    static_configs:
      - targets:
          - "__GATEWAY_TARGET__"
        labels:
          instance: "prefill_gateway"
          service: "prefill_gateway"
          language: "cpp"
    metrics_path: /metrics
    scheme: http
    scrape_timeout: 4s

  # Host process metrics (CPU / memory / threads / fds per binary).
  # Exposed by the process-exporter service on the monitoring network.
  - job_name: "tt_processes"
    static_configs:
      - targets:
          - "process-exporter:9256"
        labels:
          instance: "tt_media_server_host"
    metrics_path: /metrics
    scheme: http
    scrape_timeout: 4s
