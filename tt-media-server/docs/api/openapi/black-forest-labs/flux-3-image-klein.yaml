openapi: 3.1.0
paths:
  /v1/generations/black-forest-labs/flux-3-image-klein:
    post:
      tags:
      - Generations
      - FLUX.3 Image klein
      summary: Submit a FLUX.3 Image klein job
      description: Text to image, or editing a reference when `images` is given. Every prompt
        is rewritten by the model's prompt upsampler, which runs in the deployment or ahead
        of it; with it ahead, prompts reach the model as sent.
      operationId: submit_v1_generations_black_forest_labs_flux_3_image_klein_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Flux3ImageKleinRequest'
            examples:
              example:
                value:
                  prompt: a lighthouse on a cliff, golden hour
                  aspect_ratio: '1:1'
                  size: 2K
                  format: webp
        required: true
      responses:
        '202':
          description: Accepted and queued. Poll `GET /v1/jobs/{job_id}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: 'A media URL violates this deployment''s fetch policy: not `https`,
            a host outside the allowlist, or an address that isn''t public.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or wrong API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: This deployment does not serve that model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 'An input, inline or fetched, is over its limit: 30 MB per image, 50
            MB per video, 15 MB per audio clip; or the request''s inline (data URI) media
            total more than 64,000,000 characters (about 48 MB).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'The request is invalid for this model: an unknown field, a value out
            of range, or a conflicting combination; or an image URL couldn''t be fetched or
            doesn''t hold a supported image. Checked before queueing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: As many jobs are active as the queue holds (`max_queue_size`).
          headers:
            Retry-After:
              description: Seconds; 60 today.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The model is not serving yet, or the deployment holds as many job records
            as it can (`max_jobs`); delete finished jobs to free space.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - APIKeyHeader: []
  /v1/jobs:
    get:
      tags:
      - Generations
      - Jobs
      summary: List jobs
      description: Every job this deployment still holds, any status.
      operationId: list_jobs_v1_jobs_get
      responses:
        '200':
          description: The jobs.
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Job'
                type: array
                title: Response List Jobs V1 Jobs Get
        '401':
          description: Missing or wrong API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - APIKeyHeader: []
  /v1/jobs/{job_id}:
    get:
      tags:
      - Generations
      - Jobs
      summary: Get a job's status
      description: 'Poll until the status is final (`completed`, `failed`, `cancelled`). A

        completed job carries its `outputs`, so no second call is needed.'
      operationId: get_job_v1_jobs__job_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Missing or wrong API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Generations
      - Jobs
      summary: Delete a job and its files
      description: Only a job in a final state can be deleted; cancel an active one first.
      operationId: delete_job_v1_jobs__job_id__delete
      security:
      - APIKeyHeader: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          description: Missing or wrong API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The job is still `queued`, `in_progress` or `cancelling`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/jobs/{job_id}/content/{index}:
    get:
      tags:
      - Generations
      - Jobs
      summary: Download one output file
      description: 'The file behind `outputs[index].url`. Videos are MP4: H.264 (High

        profile, yuv420p), faststart, with an AAC audio track when the model

        generates sound (see `VideoOutput.audio`).'
      operationId: get_job_content_v1_jobs__job_id__content__index__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: index
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
          title: Index
      responses:
        '200':
          description: The file.
          content:
            image/png:
              schema:
                type: string
                contentMediaType: image/png
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
            image/webp:
              schema:
                type: string
                contentMediaType: image/webp
            video/mp4:
              schema:
                type: string
                contentMediaType: video/mp4
        '401':
          description: Missing or wrong API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The job is not `completed` (still active, failed or cancelled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/jobs/{job_id}/cancel:
    post:
      tags:
      - Generations
      - Jobs
      summary: Cancel a job
      description: 'A queued job is cancelled at once (`cancelled`). A running one moves to

        `cancelling`, then to `cancelled` once the pipeline stops.'
      operationId: cancel_job_v1_jobs__job_id__cancel_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: The job, now `cancelled` or `cancelling`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Missing or wrong API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The job is already `completed`, `failed` or `cancelled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AudioTrack:
      properties:
        codec:
          type: string
          const: aac
          title: Codec
        sample_rate:
          type: integer
          title: Sample Rate
          description: Hz.
          examples:
          - 32000
        channels:
          type: integer
          title: Channels
          examples:
          - 2
      type: object
      required:
      - codec
      - sample_rate
      - channels
      title: AudioTrack
    Deleted:
      properties:
        id:
          type: string
          title: Id
        deleted:
          type: boolean
          const: true
          title: Deleted
      type: object
      required:
      - id
      - deleted
      title: Deleted
    Error:
      properties:
        detail:
          type: string
          title: Detail
          description: Human-readable.
      type: object
      required:
      - detail
      title: Error
      description: FastAPI's default for an `HTTPException`.
    Flux3ImageKleinRequest:
      properties:
        prompt:
          type: string
          maxLength: 20000
          minLength: 1
          title: Prompt
          description: 'What to generate or how to edit, in plain words. The model''s prompt
            upsampler rewrites it into the detailed caption the model was trained on; it runs
            in the deployment or ahead of it (`FLUX3_PROMPT_UPSAMPLER_FROZEN`), and with it
            ahead the prompt reaches the model as sent. Each output reports the caption it
            was rendered from as its `prompt`. At most 20,000 characters; the upsampler''s
            input (prompt, reference and template) is at most 8,191 tokens, a longer one fails
            the job, and the caption is encoded, truncated past 4096 tokens.


            Refer to `images` by tag: `<ref_image_0>` is the first.


            Bounding boxes go at the end of the prompt: tag each element in the text (`<balloon_1>`),
            then add one space and a JSON list with a row per tag. Coordinates are `[top,
            left, bottom, right]` on a 0–1000 grid with (0, 0) at the top left, whatever the
            output shape.


            - New element: `{"id": "balloon_1", "bbox": [80, 60, 480, 380], "desc": "…"}`.

            - Element of a reference (edits): `{"id": "knight_1", "from": "ref_image_0", "src_bbox":
            […], "tgt_bbox": […], "desc": "…"}`. The same box in both keeps it; different
            boxes move or resize it; `"tgt_bbox": null` removes it; `"from": null, "src_bbox":
            null` adds a new element.'
        images:
          items:
            $ref: '#/components/schemas/Media'
          type: array
          maxItems: 1
          title: Images
          description: 'Image to edit: 0 or 1 for now; a list so more can be allowed later
            without a schema change. Omitted = text to image. Turned upright (EXIF orientation)
            and kept at its aspect ratio: scaled down, never up, to a canvas of at most 4
            MP with sides of 64–4096 px (rounded up to 16 px, the border padded with the image''s
            mirrored edge), never cropped. With the prompt upsampler in the deployment, a
            reference for a `4K` output is scaled down to a canvas of at most 1 MP: the 4
            MP canvas does not fit beside the upsampler. Any size up to 89,478,485 pixels
            (PIL''s decompression-bomb limit) and 30 MB is accepted.'
        count:
          type: integer
          maximum: 1.0
          minimum: 1.0
          title: Count
          description: Number of images. Only 1 for now; kept so more can be allowed later
            without a schema change.
          default: 1
        aspect_ratio:
          type: string
          enum:
          - '1:1'
          title: Aspect Ratio
          description: Output shape. Only `1:1` for now; more can be allowed later without
            a schema change. Each output reports its exact size. Boxes are placed on the output's
            grid.
          default: '1:1'
        size:
          type: string
          enum:
          - 1K
          - 2K
          - 4K
          title: Size
          description: 'Size tier. With `aspect_ratio`, it fixes the output size:


            | `aspect_ratio` | `1K`      | `2K`      | `4K`      |

            | -------------- | --------- | --------- | --------- |

            | `1:1`          | 1024×1024 | 2048×2048 | 4096×4096 |'
          default: 2K
        format:
          $ref: '#/components/schemas/ImageFormat'
          default: png
        seed:
          anyOf:
          - $ref: '#/components/schemas/Seed'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - prompt
      title: Flux3ImageKleinRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ImageFormat:
      type: string
      enum:
      - png
      - jpeg
      - webp
      description: Output image format.
    ImageOutput:
      properties:
        url:
          type: string
          format: uri-reference
          title: Url
          description: 'Where to download the file. Today it is a path relative to this server''s
            base URL, `v1/jobs/{job_id}/content/{index}`, fetched with the same API key; the
            runner does not know the host the console reaches it by, so it never returns one.
            If outputs later move to shared storage, it becomes an absolute URL. Clients handle
            both: an absolute URL is used as given, a relative one is resolved against the
            runner''s base URL with a trailing `/` (RFC 3986), so a base URL with a path keeps
            it. Otherwise opaque.


            Internal only. The console''s public API returns its own signed storage URLs and
            never exposes, proxies or rewrites this one, so customers never come to depend
            on a runner path.'
          examples:
          - v1/jobs/j_8f2c1d/content/0
        content_type:
          type: string
          title: Content Type
          examples:
          - image/png
          - video/mp4
        seed:
          type: integer
          title: Seed
          description: 'The job''s seed (the one chosen at random if the request had none).
            The same for every output of a job, since a batch is generated from one seed:
            resubmitting with this seed and the same request, `count` included, reproduces
            all of them.'
        prompt:
          type: string
          title: Prompt
          description: The prompt as the model received it. For Ideogram 4, the `structured_prompt`
            caption as compact JSON, in the model's key order.
        width:
          type: integer
          title: Width
        height:
          type: integer
          title: Height
        type:
          type: string
          const: image
          title: Type
      type: object
      required:
      - url
      - content_type
      - seed
      - prompt
      - width
      - height
      - type
      title: ImageOutput
    Job:
      properties:
        id:
          type: string
          title: Id
        model:
          type: string
          title: Model
          description: The `{org}/{model}` it was submitted to.
          examples:
          - wan-ai/wan2.2-i2v-a14b
          - qwen/qwen-image-edit-2511
        status:
          type: string
          enum:
          - queued
          - in_progress
          - cancelling
          - completed
          - failed
          - cancelled
          title: Status
          description: Final states are `completed`, `failed` and `cancelled`.
        created_at:
          type: integer
          title: Created At
          description: Unix seconds.
        completed_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Completed At
          description: Unix seconds, once the status is final.
        expires_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expires At
          description: 'Unix seconds when the job and its output files are deleted, once the
            status is final: `completed_at` plus the server''s retention period, 24 hours
            by default. Applies to completed, failed and cancelled jobs alike. Download outputs
            before then; after it, the job returns 404.'
        error:
          anyOf:
          - $ref: '#/components/schemas/JobError'
          - type: 'null'
          description: Set when `failed`.
        outputs:
          anyOf:
          - items:
              oneOf:
              - $ref: '#/components/schemas/ImageOutput'
              - $ref: '#/components/schemas/VideoOutput'
              discriminator:
                propertyName: type
                mapping:
                  image: '#/components/schemas/ImageOutput'
                  video: '#/components/schemas/VideoOutput'
            type: array
            minItems: 1
          - type: 'null'
          title: Outputs
          description: 'Set when `completed`: one per image (`count` of them) or one video.'
      type: object
      required:
      - id
      - model
      - status
      - created_at
      title: Job
    JobError:
      properties:
        code:
          anyOf:
          - type: string
            enum:
            - processing_error
            - stale_job
            - server_restart
          - type: string
          title: Code
          description: 'Why the job failed. More codes may be added; treat an unknown one
            like `processing_error`.


            - `processing_error`: the pipeline raised an error. Resubmitting the same request
            is unlikely to help.

            - `stale_job`: the job made no progress for too long and was force-cancelled.
            An infrastructure failure: safe to resubmit, preferably to another runner.

            - `server_restart`: the server restarted while the job was queued or running.
            Safe to resubmit.'
        message:
          type: string
          title: Message
          description: Human-readable.
      type: object
      required:
      - code
      - message
      title: JobError
    Media:
      type: string
      description: 'An `https://` URL, which the server fetches, or a data URI (`data:image/png;base64,…`).
        Inline images must be data URIs: bare base64 without the `data:` prefix is rejected
        with 422.


        PNG, JPEG or WebP, at most 30 MB per image. All data URIs in one request together
        may hold at most 64,000,000 characters (about 48 MB); send larger inputs by URL. URLs
        are fetched when the job is submitted, so a URL only has to stay valid until then
        (a presigned URL is fine). Which hosts may be fetched is set per deployment: an allowlist
        of domains, or any public host; private, loopback and cloud-metadata addresses never
        are, including after a redirect. Submission fails with 400 if a URL is not allowed,
        413 if an image is too large, and 422 if a URL can''t be fetched (expired, network
        error, timeout) or doesn''t hold a supported image.'
    Seed:
      type: integer
      maximum: 2147483647.0
      minimum: 0.0
      description: Omitted = random. Each output reports the seed it was made with.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VideoOutput:
      properties:
        url:
          type: string
          format: uri-reference
          title: Url
          description: 'Where to download the file. Today it is a path relative to this server''s
            base URL, `v1/jobs/{job_id}/content/{index}`, fetched with the same API key; the
            runner does not know the host the console reaches it by, so it never returns one.
            If outputs later move to shared storage, it becomes an absolute URL. Clients handle
            both: an absolute URL is used as given, a relative one is resolved against the
            runner''s base URL with a trailing `/` (RFC 3986), so a base URL with a path keeps
            it. Otherwise opaque.


            Internal only. The console''s public API returns its own signed storage URLs and
            never exposes, proxies or rewrites this one, so customers never come to depend
            on a runner path.'
          examples:
          - v1/jobs/j_8f2c1d/content/0
        content_type:
          type: string
          title: Content Type
          examples:
          - image/png
          - video/mp4
        seed:
          type: integer
          title: Seed
          description: 'The job''s seed (the one chosen at random if the request had none).
            The same for every output of a job, since a batch is generated from one seed:
            resubmitting with this seed and the same request, `count` included, reproduces
            all of them.'
        prompt:
          type: string
          title: Prompt
          description: The prompt as the model received it. For Ideogram 4, the `structured_prompt`
            caption as compact JSON, in the model's key order.
        width:
          type: integer
          title: Width
        height:
          type: integer
          title: Height
        type:
          type: string
          const: video
          title: Type
        fps:
          type: integer
          title: Fps
        num_frames:
          type: integer
          title: Num Frames
        duration:
          type: number
          title: Duration
          description: Seconds.
        audio:
          anyOf:
          - $ref: '#/components/schemas/AudioTrack'
          - type: 'null'
      type: object
      required:
      - url
      - content_type
      - seed
      - prompt
      - width
      - height
      - type
      - fps
      - num_frames
      - duration
      title: VideoOutput
      description: 'An MP4 file: H.264 (High profile, yuv420p), faststart. When the model

        generates sound, an AAC track described by `audio`; otherwise no audio

        track and `audio` is null.'
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: '`Authorization: Bearer <API_KEY>`, one key per deployment. Off when the
        server runs with `NO_AUTH`.'
      in: header
      name: Authorization
