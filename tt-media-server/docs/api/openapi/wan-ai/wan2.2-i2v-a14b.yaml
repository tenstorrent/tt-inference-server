openapi: 3.1.0
paths:
  /v1/generations/wan-ai/wan2.2-i2v-a14b:
    post:
      tags:
      - Generations
      - Wan2.2 I2V A14B
      summary: Submit a Wan2.2 image-to-video job
      operationId: submit_v1_generations_wan_ai_wan2_2_i2v_a14b_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Wan22i2vA14bRequest'
            examples:
              example:
                value:
                  prompt: A close-up of pink plumeria blossoms; the view slowly pulls back
                    and turns into a sailboat drifting across the sea at dawn.
                  first_frame: https://interactive-examples.mdn.mozilla.net/media/examples/plumeria.jpg
                  last_frame: data:image/png;base64,
                  aspect_ratio: '16:9'
                  size: 720p
                  frames: 81
                  seed: 1234
        required: true
      responses:
        '202':
          description: Accepted and queued. Poll `GET /v1/jobs/{job_id}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: 'An image URL violates this deployment''s fetch policy: not `https`,
            a host outside the allowlist, or an address that isn''t public.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or wrong API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: This deployment does not serve that model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 'An input, inline or fetched, is over its limit: 30 MB per image, 50
            MB per video, 15 MB per audio clip.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'The request is invalid for this model: an unknown field, a value out
            of range, or a conflicting combination; or an image URL couldn''t be fetched or
            doesn''t hold a supported image. Checked before queueing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: As many jobs are active as the queue holds (`max_queue_size`).
          headers:
            Retry-After:
              description: Seconds; 60 today.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The model is not serving yet, or the deployment holds as many job records
            as it can (`max_jobs`); delete finished jobs to free space.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - APIKeyHeader: []
  /v1/jobs:
    get:
      tags:
      - Generations
      - Jobs
      summary: List jobs
      description: Every job this deployment still holds, any status.
      operationId: list_jobs_v1_jobs_get
      responses:
        '200':
          description: The jobs.
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Job'
                type: array
                title: Response List Jobs V1 Jobs Get
        '401':
          description: Missing or wrong API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - APIKeyHeader: []
  /v1/jobs/{job_id}:
    get:
      tags:
      - Generations
      - Jobs
      summary: Get a job's status
      description: 'Poll until the status is final (`completed`, `failed`, `cancelled`). A

        completed job carries its `outputs`, so no second call is needed.'
      operationId: get_job_v1_jobs__job_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Missing or wrong API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Generations
      - Jobs
      summary: Delete a job and its files
      description: Only a job in a final state can be deleted; cancel an active one first.
      operationId: delete_job_v1_jobs__job_id__delete
      security:
      - APIKeyHeader: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          description: Missing or wrong API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The job is still `queued`, `in_progress` or `cancelling`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/jobs/{job_id}/content/{index}:
    get:
      tags:
      - Generations
      - Jobs
      summary: Download one output file
      description: 'The file behind `outputs[index].url`. Videos are MP4: H.264 (High

        profile, yuv420p), faststart, with an AAC audio track when the model

        generates sound (see `VideoOutput.audio`).'
      operationId: get_job_content_v1_jobs__job_id__content__index__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: index
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
          title: Index
      responses:
        '200':
          description: The file.
          content:
            video/mp4:
              schema:
                type: string
                contentMediaType: video/mp4
        '401':
          description: Missing or wrong API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The job is not `completed` (still active, failed or cancelled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/jobs/{job_id}/cancel:
    post:
      tags:
      - Generations
      - Jobs
      summary: Cancel a job
      description: 'A queued job is cancelled at once (`cancelled`). A running one moves to

        `cancelling`, then to `cancelled` once the pipeline stops.'
      operationId: cancel_job_v1_jobs__job_id__cancel_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: The job, now `cancelled` or `cancelling`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Missing or wrong API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The job is already `completed`, `failed` or `cancelled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AudioTrack:
      properties:
        codec:
          type: string
          const: aac
          title: Codec
        sample_rate:
          type: integer
          title: Sample Rate
          description: Hz.
          examples:
          - 32000
        channels:
          type: integer
          title: Channels
          examples:
          - 2
      type: object
      required:
      - codec
      - sample_rate
      - channels
      title: AudioTrack
    Deleted:
      properties:
        id:
          type: string
          title: Id
        deleted:
          type: boolean
          const: true
          title: Deleted
      type: object
      required:
      - id
      - deleted
      title: Deleted
    Error:
      properties:
        detail:
          type: string
          title: Detail
          description: Human-readable.
      type: object
      required:
      - detail
      title: Error
      description: FastAPI's default for an `HTTPException`.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ImageOutput:
      properties:
        url:
          type: string
          format: uri-reference
          title: Url
          description: 'Where to download the file. Today it is a path relative to this server''s
            base URL, `/v1/jobs/{job_id}/content/{index}`, fetched with the same API key;
            the runner does not know the host the console reaches it by, so it never returns
            one. If outputs later move to shared storage, it becomes an absolute URL. Clients
            handle both: an absolute URL is used as given, a relative one is resolved against
            the runner''s base URL (RFC 3986). Otherwise opaque.


            Internal only. The console''s public API returns its own signed storage URLs and
            never exposes, proxies or rewrites this one, so customers never come to depend
            on a runner path.'
          examples:
          - /v1/jobs/j_8f2c1d/content/0
        content_type:
          type: string
          title: Content Type
          examples:
          - image/png
          - video/mp4
        seed:
          type: integer
          title: Seed
          description: 'The job''s seed (the one chosen at random if the request had none).
            The same for every output of a job, since a batch is generated from one seed:
            resubmitting with this seed and the same request, `count` included, reproduces
            all of them.'
        prompt:
          type: string
          title: Prompt
          description: The prompt as the model received it. For Ideogram 4, the `structured_prompt`
            caption as compact JSON, in the model's key order.
        width:
          type: integer
          title: Width
        height:
          type: integer
          title: Height
        type:
          type: string
          const: image
          title: Type
      type: object
      required:
      - url
      - content_type
      - seed
      - prompt
      - width
      - height
      - type
      title: ImageOutput
    Job:
      properties:
        id:
          type: string
          title: Id
        model:
          type: string
          title: Model
          description: The `{org}/{model}` it was submitted to.
          examples:
          - wan-ai/wan2.2-i2v-a14b
          - qwen/qwen-image-edit-2511
        status:
          type: string
          enum:
          - queued
          - in_progress
          - cancelling
          - completed
          - failed
          - cancelled
          title: Status
          description: Final states are `completed`, `failed` and `cancelled`.
        created_at:
          type: integer
          title: Created At
          description: Unix seconds.
        completed_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Completed At
          description: Unix seconds, once the status is final.
        expires_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expires At
          description: 'Unix seconds when the job and its output files are deleted, once the
            status is final: `completed_at` plus the server''s retention period, 24 hours
            by default. Applies to completed, failed and cancelled jobs alike. Download outputs
            before then; after it, the job returns 404.'
        error:
          anyOf:
          - $ref: '#/components/schemas/JobError'
          - type: 'null'
          description: Set when `failed`.
        outputs:
          anyOf:
          - items:
              oneOf:
              - $ref: '#/components/schemas/ImageOutput'
              - $ref: '#/components/schemas/VideoOutput'
              discriminator:
                propertyName: type
                mapping:
                  image: '#/components/schemas/ImageOutput'
                  video: '#/components/schemas/VideoOutput'
            type: array
            minItems: 1
          - type: 'null'
          title: Outputs
          description: 'Set when `completed`: one per image (`count` of them) or one video.'
      type: object
      required:
      - id
      - model
      - status
      - created_at
      title: Job
    JobError:
      properties:
        code:
          anyOf:
          - type: string
            enum:
            - processing_error
            - stale_job
            - server_restart
          - type: string
          title: Code
          description: 'Why the job failed. More codes may be added; treat an unknown one
            like `processing_error`.


            - `processing_error`: the pipeline raised an error. Resubmitting the same request
            is unlikely to help.

            - `stale_job`: the job made no progress for too long and was force-cancelled.
            An infrastructure failure: safe to resubmit, preferably to another runner.

            - `server_restart`: the server restarted while the job was queued or running.
            Safe to resubmit.'
        message:
          type: string
          title: Message
          description: Human-readable.
      type: object
      required:
      - code
      - message
      title: JobError
    Media:
      type: string
      description: 'An `https://` URL, which the server fetches, or a data URI (`data:image/png;base64,…`).
        Inline images must be data URIs: bare base64 without the `data:` prefix is rejected
        with 422.


        PNG, JPEG or WebP, at most 30 MB per image. URLs are fetched when the job is submitted,
        so a URL only has to stay valid until then (a presigned URL is fine). Which hosts
        may be fetched is set per deployment: an allowlist of domains, or any public host;
        private, loopback and cloud-metadata addresses never are, including after a redirect.
        Submission fails with 400 if a URL is not allowed, 413 if an image is too large, and
        422 if a URL can''t be fetched (expired, network error, timeout) or doesn''t hold
        a supported image.'
    Seed:
      type: integer
      maximum: 2147483647.0
      minimum: 0.0
      description: Omitted = random. Each output reports the seed it was made with.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VideoOutput:
      properties:
        url:
          type: string
          format: uri-reference
          title: Url
          description: 'Where to download the file. Today it is a path relative to this server''s
            base URL, `/v1/jobs/{job_id}/content/{index}`, fetched with the same API key;
            the runner does not know the host the console reaches it by, so it never returns
            one. If outputs later move to shared storage, it becomes an absolute URL. Clients
            handle both: an absolute URL is used as given, a relative one is resolved against
            the runner''s base URL (RFC 3986). Otherwise opaque.


            Internal only. The console''s public API returns its own signed storage URLs and
            never exposes, proxies or rewrites this one, so customers never come to depend
            on a runner path.'
          examples:
          - /v1/jobs/j_8f2c1d/content/0
        content_type:
          type: string
          title: Content Type
          examples:
          - image/png
          - video/mp4
        seed:
          type: integer
          title: Seed
          description: 'The job''s seed (the one chosen at random if the request had none).
            The same for every output of a job, since a batch is generated from one seed:
            resubmitting with this seed and the same request, `count` included, reproduces
            all of them.'
        prompt:
          type: string
          title: Prompt
          description: The prompt as the model received it. For Ideogram 4, the `structured_prompt`
            caption as compact JSON, in the model's key order.
        width:
          type: integer
          title: Width
        height:
          type: integer
          title: Height
        type:
          type: string
          const: video
          title: Type
        fps:
          type: integer
          title: Fps
        num_frames:
          type: integer
          title: Num Frames
        duration:
          type: number
          title: Duration
          description: Seconds.
        audio:
          anyOf:
          - $ref: '#/components/schemas/AudioTrack'
          - type: 'null'
      type: object
      required:
      - url
      - content_type
      - seed
      - prompt
      - width
      - height
      - type
      - fps
      - num_frames
      - duration
      title: VideoOutput
      description: 'An MP4 file: H.264 (High profile, yuv420p), faststart. When the model

        generates sound, an AAC track described by `audio`; otherwise no audio

        track and `audio` is null.'
    Wan22i2vA14bRequest:
      properties:
        prompt:
          type: string
          minLength: 1
          title: Prompt
        negative_prompt:
          type: string
          title: Negative Prompt
          description: 'Omitted = Wan2.2''s reference default (`sample_neg_prompt` in `wan/configs/shared_config.py`),
            a list of common defects in Chinese: oversaturated, overexposed, static, blurry
            details, subtitles, worst quality, JPEG artifacts, deformed hands and faces, extra
            fingers, three legs, cluttered background, walking backwards, and similar. A request''s
            `negative_prompt` replaces it rather than adding to it.'
          default: 色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走
        first_frame:
          $ref: '#/components/schemas/Media'
          description: The image the video starts from. Resized and center-cropped to the
            output size.
        last_frame:
          anyOf:
          - $ref: '#/components/schemas/Media'
          - type: 'null'
          description: The image the video ends on. Resized and center-cropped to the output
            size.
        aspect_ratio:
          type: string
          enum:
          - '16:9'
          - '9:16'
          title: Aspect Ratio
          description: Output shape. With `size`, it fixes the output size (see `size`).
        size:
          type: string
          enum:
          - 480p
          - 720p
          title: Size
          description: 'Size tier. With `aspect_ratio`, it fixes the output size:


            | `aspect_ratio` | `480p`  | `720p`   |

            | -------------- | ------- | -------- |

            | `16:9`         | 832×480 | 1280×720 |

            | `9:16`         | 480×832 | 720×1280 |


            These are Wan2.2''s reference sizes.'
        frames:
          type: integer
          maximum: 81.0
          minimum: 81.0
          title: Frames
          description: Number of frames. Only 81 for now, the default of Wan2.2's reference
            config. Played at a fixed 16 fps (the reference config's), so about 5 s; the output
            reports `fps` and `duration`.
          default: 81
        seed:
          anyOf:
          - $ref: '#/components/schemas/Seed'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - prompt
      - first_frame
      - aspect_ratio
      - size
      title: Wan22i2vA14bRequest
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: '`Authorization: Bearer <API_KEY>`, one key per deployment. Off when the
        server runs with `NO_AUTH`.'
      in: header
      name: Authorization
