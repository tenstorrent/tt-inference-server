openapi: 3.1.0
paths:
  /v1/generations/minimaxai/minimax-h3-ref2va:
    post:
      tags:
      - Generations
      - MiniMax-H3 Ref2VA
      summary: Submit a MiniMax-H3 Ref2VA job
      description: Video with sound from text plus reference images, videos and audio clips.
        Runs the `Ref2VA` checkpoint of `MiniMaxAI/MiniMax-H3`.
      operationId: submit_v1_generations_minimaxai_minimax_h3_ref2va_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiniMaxH3Ref2VARequest'
            examples:
              example:
                value:
                  prompt: The plumeria from Picture 1 sways in the garden from Video 1 while
                    the wren from Audio 2 sings nearby.
                  images:
                  - https://interactive-examples.mdn.mozilla.net/media/examples/plumeria.jpg
                  videos:
                  - https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4
                  audios:
                  - https://upload.wikimedia.org/wikipedia/commons/c/ce/Carolina_Wren_%28Thryothorus_ludovicianus%29_-_New_Jersey_2023-02-23.mp3
                  duration: 5
        required: true
      responses:
        '202':
          description: Accepted and queued. Poll `GET /v1/jobs/{job_id}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: 'A media URL violates this deployment''s fetch policy: not `https`,
            a host outside the allowlist, or an address that isn''t public.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or wrong API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: This deployment does not serve that model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 'An input, inline or fetched, is over its limit: 30 MB per image, 50
            MB per video, 15 MB per audio clip.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'The request is invalid for this model: an unknown field, a value out
            of range, or a conflicting combination; or an image URL couldn''t be fetched or
            doesn''t hold a supported image. Checked before queueing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: As many jobs are active as the queue holds (`max_queue_size`).
          headers:
            Retry-After:
              description: Seconds; 60 today.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The model is not serving yet, or the deployment holds as many job records
            as it can (`max_jobs`); delete finished jobs to free space.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - APIKeyHeader: []
  /v1/jobs:
    get:
      tags:
      - Generations
      - Jobs
      summary: List jobs
      description: Every job this deployment still holds, any status.
      operationId: list_jobs_v1_jobs_get
      responses:
        '200':
          description: The jobs.
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Job'
                type: array
                title: Response List Jobs V1 Jobs Get
        '401':
          description: Missing or wrong API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - APIKeyHeader: []
  /v1/jobs/{job_id}:
    get:
      tags:
      - Generations
      - Jobs
      summary: Get a job's status
      description: 'Poll until the status is final (`completed`, `failed`, `cancelled`). A

        completed job carries its `outputs`, so no second call is needed.'
      operationId: get_job_v1_jobs__job_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Missing or wrong API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Generations
      - Jobs
      summary: Delete a job and its files
      description: Only a job in a final state can be deleted; cancel an active one first.
      operationId: delete_job_v1_jobs__job_id__delete
      security:
      - APIKeyHeader: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          description: Missing or wrong API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The job is still `queued`, `in_progress` or `cancelling`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/jobs/{job_id}/content/{index}:
    get:
      tags:
      - Generations
      - Jobs
      summary: Download one output file
      description: 'The file behind `outputs[index].url`. Videos are MP4: H.264 (High

        profile, yuv420p), faststart, with an AAC audio track when the model

        generates sound (see `VideoOutput.audio`).'
      operationId: get_job_content_v1_jobs__job_id__content__index__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: index
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
          title: Index
      responses:
        '200':
          description: The file.
          content:
            video/mp4:
              schema:
                type: string
                contentMediaType: video/mp4
        '401':
          description: Missing or wrong API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The job is not `completed` (still active, failed or cancelled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/jobs/{job_id}/cancel:
    post:
      tags:
      - Generations
      - Jobs
      summary: Cancel a job
      description: 'A queued job is cancelled at once (`cancelled`). A running one moves to

        `cancelling`, then to `cancelled` once the pipeline stops.'
      operationId: cancel_job_v1_jobs__job_id__cancel_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: The job, now `cancelled` or `cancelling`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Missing or wrong API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The job is already `completed`, `failed` or `cancelled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AudioMedia:
      type: string
      description: 'An audio clip: an `https://` URL or a data URI (`data:audio/wav;base64,…`),
        fetched and checked as for `Media`.


        WAV or MP3, mono or stereo; at most 15 MB. Each model states the durations it accepts.'
    AudioTrack:
      properties:
        codec:
          type: string
          const: aac
          title: Codec
        sample_rate:
          type: integer
          title: Sample Rate
          description: Hz.
          examples:
          - 32000
        channels:
          type: integer
          title: Channels
          examples:
          - 2
      type: object
      required:
      - codec
      - sample_rate
      - channels
      title: AudioTrack
    Deleted:
      properties:
        id:
          type: string
          title: Id
        deleted:
          type: boolean
          const: true
          title: Deleted
      type: object
      required:
      - id
      - deleted
      title: Deleted
    Error:
      properties:
        detail:
          type: string
          title: Detail
          description: Human-readable.
      type: object
      required:
      - detail
      title: Error
      description: FastAPI's default for an `HTTPException`.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ImageOutput:
      properties:
        url:
          type: string
          format: uri-reference
          title: Url
          description: 'Where to download the file. Today it is a path relative to this server''s
            base URL, `v1/jobs/{job_id}/content/{index}`, fetched with the same API key; the
            runner does not know the host the console reaches it by, so it never returns one.
            If outputs later move to shared storage, it becomes an absolute URL. Clients handle
            both: an absolute URL is used as given, a relative one is resolved against the
            runner''s base URL with a trailing `/` (RFC 3986), so a base URL with a path keeps
            it. Otherwise opaque.


            Internal only. The console''s public API returns its own signed storage URLs and
            never exposes, proxies or rewrites this one, so customers never come to depend
            on a runner path.'
          examples:
          - v1/jobs/j_8f2c1d/content/0
        content_type:
          type: string
          title: Content Type
          examples:
          - image/png
          - video/mp4
        seed:
          type: integer
          title: Seed
          description: 'The job''s seed (the one chosen at random if the request had none).
            The same for every output of a job, since a batch is generated from one seed:
            resubmitting with this seed and the same request, `count` included, reproduces
            all of them.'
        prompt:
          type: string
          title: Prompt
          description: The prompt as the model received it. For Ideogram 4, the `structured_prompt`
            caption as compact JSON, in the model's key order.
        width:
          type: integer
          title: Width
        height:
          type: integer
          title: Height
        type:
          type: string
          const: image
          title: Type
      type: object
      required:
      - url
      - content_type
      - seed
      - prompt
      - width
      - height
      - type
      title: ImageOutput
    Job:
      properties:
        id:
          type: string
          title: Id
        model:
          type: string
          title: Model
          description: The `{org}/{model}` it was submitted to.
          examples:
          - wan-ai/wan2.2-i2v-a14b
          - qwen/qwen-image-edit-2511
        status:
          type: string
          enum:
          - queued
          - in_progress
          - cancelling
          - completed
          - failed
          - cancelled
          title: Status
          description: Final states are `completed`, `failed` and `cancelled`.
        created_at:
          type: integer
          title: Created At
          description: Unix seconds.
        completed_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Completed At
          description: Unix seconds, once the status is final.
        expires_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expires At
          description: 'Unix seconds when the job and its output files are deleted, once the
            status is final: `completed_at` plus the server''s retention period, 24 hours
            by default. Applies to completed, failed and cancelled jobs alike. Download outputs
            before then; after it, the job returns 404.'
        error:
          anyOf:
          - $ref: '#/components/schemas/JobError'
          - type: 'null'
          description: Set when `failed`.
        outputs:
          anyOf:
          - items:
              oneOf:
              - $ref: '#/components/schemas/ImageOutput'
              - $ref: '#/components/schemas/VideoOutput'
              discriminator:
                propertyName: type
                mapping:
                  image: '#/components/schemas/ImageOutput'
                  video: '#/components/schemas/VideoOutput'
            type: array
            minItems: 1
          - type: 'null'
          title: Outputs
          description: 'Set when `completed`: one per image (`count` of them) or one video.'
      type: object
      required:
      - id
      - model
      - status
      - created_at
      title: Job
    JobError:
      properties:
        code:
          anyOf:
          - type: string
            enum:
            - processing_error
            - stale_job
            - server_restart
          - type: string
          title: Code
          description: 'Why the job failed. More codes may be added; treat an unknown one
            like `processing_error`.


            - `processing_error`: the pipeline raised an error. Resubmitting the same request
            is unlikely to help.

            - `stale_job`: the job made no progress for too long and was force-cancelled.
            An infrastructure failure: safe to resubmit, preferably to another runner.

            - `server_restart`: the server restarted while the job was queued or running.
            Safe to resubmit.'
        message:
          type: string
          title: Message
          description: Human-readable.
      type: object
      required:
      - code
      - message
      title: JobError
    Media:
      type: string
      description: 'An `https://` URL, which the server fetches, or a data URI (`data:image/png;base64,…`).
        Inline images must be data URIs: bare base64 without the `data:` prefix is rejected
        with 422.


        PNG, JPEG or WebP, at most 30 MB per image. URLs are fetched when the job is submitted,
        so a URL only has to stay valid until then (a presigned URL is fine). Which hosts
        may be fetched is set per deployment: an allowlist of domains, or any public host;
        private, loopback and cloud-metadata addresses never are, including after a redirect.
        Submission fails with 400 if a URL is not allowed, 413 if an image is too large, and
        422 if a URL can''t be fetched (expired, network error, timeout) or doesn''t hold
        a supported image.'
    MiniMaxH3Ref2VARequest:
      properties:
        prompt:
          type: string
          minLength: 1
          title: Prompt
          description: 'Refer to references by kind and position: `Picture i` is the i-th
            of `images` and `Video k` the k-th of `videos`. `Audio j` numbers everything with
            sound: first the soundtracks of `videos`, in order, then `audios`. So with one
            video that has sound, the first of `audios` is `Audio 2`. The model sees each
            reference under that label.'
        aspect_ratio:
          type: string
          enum:
          - '21:9'
          - '16:9'
          - '4:3'
          - '1:1'
          - '3:4'
          - '9:16'
          title: Aspect Ratio
          description: 'Output shape, as for text-to-video: the references don''t set it.
            Each output reports its exact size.'
          default: '16:9'
        size:
          type: string
          const: 768p
          title: Size
          description: 'Size tier: a short edge of 768, the area capped at 768×1344, sides
            multiples of 32:


            | `aspect_ratio` | `768p`    |

            | -------------- | --------- |

            | `21:9`         | 1536×672  |

            | `16:9`         | 1344×768  |

            | `4:3`          | 1024×768  |

            | `1:1`          | 768×768   |

            | `3:4`          | 768×1024  |

            | `9:16`         | 768×1344  |


            Only `768p` for now; kept so other tiers can be added without a schema change.'
          default: 768p
        duration:
          type: integer
          maximum: 15.0
          minimum: 4.0
          title: Duration
          description: 'Seconds. The video runs at 24 fps and its length is rounded up to
            the frame counts the model generates (17k + 5): 5 s gives 124 frames (5.17 s).
            Each output reports its exact `duration` and `num_frames`.'
          default: 5
        seed:
          anyOf:
          - $ref: '#/components/schemas/Seed'
          - type: 'null'
        images:
          items:
            $ref: '#/components/schemas/Media'
          type: array
          maxItems: 9
          title: Images
          description: Reference images, aspect ratio from 1:4 to 4:1.
        videos:
          items:
            $ref: '#/components/schemas/VideoMedia'
          type: array
          maxItems: 3
          title: Videos
          description: Reference video clips, 2–15 s each, at most 15 s combined. A clip's
            soundtrack, if it has one, is also audio conditioning and counts toward the audio
            limits (see `audios`).
        audios:
          items:
            $ref: '#/components/schemas/AudioMedia'
          type: array
          maxItems: 3
          title: Audios
          description: 'Reference audio clips, 2–15 s each. The audio limits cover these clips
            plus the soundtrack of every reference video that has one: at most 3 audio references
            and at most 15 s of audio combined, or 422.'
      additionalProperties: false
      type: object
      required:
      - prompt
      title: MiniMaxH3Ref2VARequest
      description: 'Shared by every MiniMax-H3 Ref2VA deployment, whatever its sampling

        (e.g. `tenstorrent/minimax-h3-ref2va-lightx2v`).


        References: at most 12 in total, and at least one image or video (audio

        alone is rejected with 422). Video and audio clips are 2–15 s each and

        at most 15 s combined per kind.


        A reference video''s soundtrack is audio conditioning: it counts toward

        the audio limits (at most 3 audio references, at most 15 s of audio

        combined) as well as the video ones. A video with sound counts once

        toward the 12-reference total.'
    Seed:
      type: integer
      maximum: 2147483647.0
      minimum: 0.0
      description: Omitted = random. Each output reports the seed it was made with.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VideoMedia:
      type: string
      description: 'A video clip: an `https://` URL or a data URI (`data:video/mp4;base64,…`),
        fetched and checked as for `Media`.


        MP4 or MOV, H.264 or H.265 video, optionally with an AAC or MP3 audio track; at most
        50 MB. Each model states the durations it accepts.'
    VideoOutput:
      properties:
        url:
          type: string
          format: uri-reference
          title: Url
          description: 'Where to download the file. Today it is a path relative to this server''s
            base URL, `v1/jobs/{job_id}/content/{index}`, fetched with the same API key; the
            runner does not know the host the console reaches it by, so it never returns one.
            If outputs later move to shared storage, it becomes an absolute URL. Clients handle
            both: an absolute URL is used as given, a relative one is resolved against the
            runner''s base URL with a trailing `/` (RFC 3986), so a base URL with a path keeps
            it. Otherwise opaque.


            Internal only. The console''s public API returns its own signed storage URLs and
            never exposes, proxies or rewrites this one, so customers never come to depend
            on a runner path.'
          examples:
          - v1/jobs/j_8f2c1d/content/0
        content_type:
          type: string
          title: Content Type
          examples:
          - image/png
          - video/mp4
        seed:
          type: integer
          title: Seed
          description: 'The job''s seed (the one chosen at random if the request had none).
            The same for every output of a job, since a batch is generated from one seed:
            resubmitting with this seed and the same request, `count` included, reproduces
            all of them.'
        prompt:
          type: string
          title: Prompt
          description: The prompt as the model received it. For Ideogram 4, the `structured_prompt`
            caption as compact JSON, in the model's key order.
        width:
          type: integer
          title: Width
        height:
          type: integer
          title: Height
        type:
          type: string
          const: video
          title: Type
        fps:
          type: integer
          title: Fps
        num_frames:
          type: integer
          title: Num Frames
        duration:
          type: number
          title: Duration
          description: Seconds.
        audio:
          anyOf:
          - $ref: '#/components/schemas/AudioTrack'
          - type: 'null'
      type: object
      required:
      - url
      - content_type
      - seed
      - prompt
      - width
      - height
      - type
      - fps
      - num_frames
      - duration
      title: VideoOutput
      description: 'An MP4 file: H.264 (High profile, yuv420p), faststart. When the model

        generates sound, an AAC track described by `audio`; otherwise no audio

        track and `audio` is null.'
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: '`Authorization: Bearer <API_KEY>`, one key per deployment. Off when the
        server runs with `NO_AUTH`.'
      in: header
      name: Authorization
