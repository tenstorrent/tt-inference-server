openapi: 3.1.0
info:
  title: FLUX.2 klein 4B generation API (tt-media-server)
  version: 0.1.0
  description: |
    What a `black-forest-labs/flux.2-klein-4b` deployment serves: its submit endpoint and
    the common `/v1/jobs` API. Shared schemas, responses and auth live
    in `common.yaml`, which also describes the API as a whole.
security:
  - Bearer: []
paths:
  /v1/generations/black-forest-labs/flux.2-klein-4b:
    post:
      operationId: submitFlux2klein4b
      tags: [FLUX.2 klein 4B]
      summary: Submit a FLUX.2 klein 4B job
      description: |
        Text to image, or editing when `images` is given.

        **Elsewhere:** BFL `POST /v1/flux-2-klein-4b`, fal `POST
        /fal-ai/flux-2/klein/4b` (text to image) and `POST
        /fal-ai/flux-2/klein/4b/edit` (with images), Replicate
        `black-forest-labs/flux-2-klein-4b`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Flux2klein4bRequest"
            example:
              prompt: a lighthouse on a cliff, golden hour
              aspect_ratio: "16:9"
              size: 2K
              format: webp
      responses:
        "202":
          $ref: "../../common.yaml#/components/responses/Submitted"
        "400":
          $ref: "../../common.yaml#/components/responses/MediaUrlNotAllowed"
        "401":
          $ref: "../../common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "../../common.yaml#/components/responses/NotServed"
        "413":
          $ref: "../../common.yaml#/components/responses/MediaTooLarge"
        "422":
          $ref: "../../common.yaml#/components/responses/Invalid"
        "429":
          $ref: "../../common.yaml#/components/responses/QueueFull"
        "503":
          $ref: "../../common.yaml#/components/responses/Unavailable"
  /v1/jobs:
    $ref: ../../common.yaml#/paths/~1v1~1jobs
  /v1/jobs/{job_id}:
    $ref: ../../common.yaml#/paths/~1v1~1jobs~1%7Bjob_id%7D
  /v1/jobs/{job_id}/content/{index}:
    $ref: ../../common.yaml#/paths/~1v1~1jobs~1%7Bjob_id%7D~1content~1%7Bindex%7D
  /v1/jobs/{job_id}/cancel:
    $ref: ../../common.yaml#/paths/~1v1~1jobs~1%7Bjob_id%7D~1cancel
components:
  schemas:
    Flux2klein4bRequest:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          description: |
            **Elsewhere:** BFL, fal, Replicate `prompt`.
        images:
          type: array
          maxItems: 4
          items:
            $ref: "../../common.yaml#/components/schemas/Media"
          description: |
            Images to edit or draw from. Omitted = text to image.

            **Elsewhere:** BFL `input_image` … `input_image_4`, fal `image_urls`
            (max 4, edit endpoint), Replicate `images` (max 5).
        count:
          type: integer
          minimum: 1
          maximum: 1
          default: 1
          description: |
            Number of images. Only 1 for now; kept so more can be allowed later
            without a schema change.

            **Elsewhere:** fal `num_images` (1–4); BFL, Replicate have none.
        aspect_ratio:
          type: string
          enum: ["1:1", "16:9", "9:16", "4:3", "3:4", "3:2", "2:3"]
          description: |
            Output shape. Omitted = the ratio here closest to the first image's,
            or `1:1` without images. Each output reports its exact size.

            **Elsewhere:** Replicate `aspect_ratio` (more ratios plus
            `match_input_image`), fal `image_size` presets (`landscape_16_9`,
            …); BFL: `width`/`height` only. diffusers uses the first image's
            own size when none is given.
        size:
          type: string
          enum: [1K, 2K]
          default: 1K
          description: |
            Size tier. With `aspect_ratio`, it fixes the output size:

            | `aspect_ratio` | `1K` (about 1 MP) | `2K` (about 4 MP) |
            | -------------- | ----------------- | ----------------- |
            | `1:1`          | 1024×1024         | 2048×2048         |
            | `16:9`         | 1376×768          | 2752×1536         |
            | `9:16`         | 768×1376          | 1536×2752         |
            | `4:3`          | 1184×896          | 2368×1792         |
            | `3:4`          | 896×1184          | 1792×2368         |
            | `3:2`          | 1248×832          | 2496×1664         |
            | `2:3`          | 832×1248          | 1664×2496         |

            **Elsewhere:** Replicate `output_megapixels` (`0.25` … `4`), BFL
            `width`/`height`, fal `image_size: {width, height}`, OpenRouter
            `resolution` (`1K`, `2K`, …).
        format:
          $ref: "../../common.yaml#/components/schemas/ImageFormat"
        seed:
          $ref: "../../common.yaml#/components/schemas/Seed"

