openapi: 3.1.0
info:
  title: Qwen-Image-Edit-2511 generation API (tt-media-server)
  version: 0.1.0
  description: |
    What a `qwen/qwen-image-edit-2511` deployment serves: its submit endpoint and
    the common `/v1/jobs` API. Shared schemas, responses and auth live
    in `common.yaml`, which also describes the API as a whole.
security:
  - Bearer: []
paths:
  /v1/generations/qwen/qwen-image-edit-2511:
    post:
      operationId: submitQwenImageEdit2511
      tags: [Qwen-Image-Edit-2511]
      summary: Submit a Qwen-Image-Edit-2511 job
      description: |
        **Elsewhere:** fal `POST /fal-ai/qwen-image-edit-2511`, Replicate
        `qwen/qwen-image-edit-2511`, tt-media-server today `POST
        /v1/images/edits` (returns the images directly).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QwenImageEdit2511Request"
            example:
              prompt: >-
                put the person from the second image on the bench in the first
              negative_prompt: blurry
              images:
                - https://storage.internal/inputs/bench.jpg
                - data:image/jpeg;base64,/9j/4AAQ…
              format: png
      responses:
        "202":
          $ref: "../../common.yaml#/components/responses/Submitted"
        "400":
          $ref: "../../common.yaml#/components/responses/MediaUrlNotAllowed"
        "401":
          $ref: "../../common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "../../common.yaml#/components/responses/NotServed"
        "413":
          $ref: "../../common.yaml#/components/responses/MediaTooLarge"
        "422":
          $ref: "../../common.yaml#/components/responses/Invalid"
        "429":
          $ref: "../../common.yaml#/components/responses/QueueFull"
        "503":
          $ref: "../../common.yaml#/components/responses/Unavailable"
  /v1/jobs:
    $ref: ../../common.yaml#/paths/~1v1~1jobs
  /v1/jobs/{job_id}:
    $ref: ../../common.yaml#/paths/~1v1~1jobs~1%7Bjob_id%7D
  /v1/jobs/{job_id}/content/{index}:
    $ref: ../../common.yaml#/paths/~1v1~1jobs~1%7Bjob_id%7D~1content~1%7Bindex%7D
  /v1/jobs/{job_id}/cancel:
    $ref: ../../common.yaml#/paths/~1v1~1jobs~1%7Bjob_id%7D~1cancel
components:
  securitySchemes:
    Bearer:
      $ref: "../../common.yaml#/components/securitySchemes/Bearer"
  schemas:
    QwenImageEdit2511Request:
      type: object
      additionalProperties: false
      required: [prompt, images]
      properties:
        prompt:
          type: string
          minLength: 1
          description: |
            The edit instruction.

            **Elsewhere:** fal, Replicate `prompt`.
        negative_prompt:
          type: string
          default: " "
          description: |
            Omitted = `" "` (a single space), the model card's default, so
            classifier-free guidance always applies.

            **Elsewhere:** fal `negative_prompt`; Replicate has none. In
            diffusers, omitting it turns guidance off.
        images:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "../../common.yaml#/components/schemas/Media"
          description: |
            The image(s) to edit or combine. Each is resized to the supported
            size closest to its aspect ratio. At most 3, as in tt_dit's
            Qwen-Image-Edit-2511 pipeline; no provider spec gives a maximum.

            **Elsewhere:** fal `image_urls`, Replicate `image` (a list),
            tt-media-server today `image` (one).
        count:
          type: integer
          minimum: 1
          maximum: 1
          default: 1
          description: |
            Number of images. Only 1 for now; kept so more can be allowed later
            without a schema change.

            **Elsewhere:** fal `num_images` (1–4); Replicate has none.
        aspect_ratio:
          type: string
          enum: ["1:1", "16:9", "9:16", "4:3", "3:4", "3:2", "2:3"]
          description: |
            Output shape, at about 1 MP: `1:1` 1024×1024, `16:9` 1376×768,
            `9:16` 768×1376, `4:3` 1184×896, `3:4` 896×1184, `3:2` 1248×832,
            `2:3` 832×1248 (diffusers' edit sizes, as in tt_dit's pipeline).
            Omitted = the ratio closest to the last image's, as in diffusers'
            reference pipeline. Each output reports its exact size.

            **Elsewhere:** Replicate `aspect_ratio` (the first five plus
            `match_input_image`, the default); fal `image_size` (omitted = input
            size).
        format:
          $ref: "../../common.yaml#/components/schemas/ImageFormat"
        seed:
          $ref: "../../common.yaml#/components/schemas/Seed"

