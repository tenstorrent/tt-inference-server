#
# Expected LoRA training-loss trajectory for meta-llama/Llama-3.1-8B-Instruct on
# SST-2, run through the media server's `ttml-training-lora` runner (tt-metal's
# tt-train SFTTrainer) on P150, P300 and P300X2, all single-chip (see
# workflows/training/registry.py).
#
# expected_losses was recorded on P300X2 (one chip) with the image built with
# BUILD_TT_TRAIN=true at tt-metal 158d41fa4c44 (2026-11-24); repeated runs gave
# identical values. Regenerate whenever the tt-metal commit of the image moves.

# Hyperparameters forwarded verbatim into the TrainingRequest POST body, laid
# out as tt-metal's experimental trainer recipes are. Kept small so a nightly P150
# job stays bounded while still exercising the full submit -> train -> metrics
# path. Checkpointing is intentionally disabled (save_strategy "none"), so no
# adapter is written; this test only grades the loss trajectory from
# GET /v1/jobs/{id}/metrics.
request:
  model:
    lora:
      r: 4
      alpha: 8
      target_modules: [q_proj, k_proj, v_proj, o_proj]
      task_type: CAUSAL_LM
  dataset:
    id: sst2
  optimizer:
    type: adamw
    lr: 0.0001
  dtype: bfloat16
  max_length: 64
  batch_size: 8
  seed: 0
  stopping_criteria:
    type: step
    limit: 15
  metrics:
    train:
      frequency: 5
    validation:
      frequency: 5
  checkpoint:
    save_strategy:
      type: none

# Tolerances around the recorded trajectory; revisit them once it is recorded.
tolerances:
  rtol: 0.15
  atol: 0.2

checks:
  # Final training loss must be strictly below the first recorded value; fewer
  # than two train_loss points fails.
  require_decreasing: true
  # Absolute ceiling on the final training loss (guards against a diverged run
  # that happens to be "decreasing"). Tune after regeneration.
  final_train_loss_max: 5.0

# Per-checkpoint expectations (steps must line up with metrics.train.frequency /
# metrics.validation.frequency). val_loss at step 0 is the validation pass
# before the first optimizer step; train_loss is the mean over its window.
expected_losses:
  - {global_step: 0,  metric_name: val_loss,   value: 6.393922}
  - {global_step: 5,  metric_name: train_loss, value: 6.031250}
  - {global_step: 5,  metric_name: val_loss,   value: 4.330275}
  - {global_step: 10, metric_name: train_loss, value: 3.468750}
  - {global_step: 10, metric_name: val_loss,   value: 2.197033}
  - {global_step: 15, metric_name: train_loss, value: 1.530469}
  - {global_step: 15, metric_name: val_loss,   value: 0.835830}
