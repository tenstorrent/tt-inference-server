#
# Expected LoRA training-loss trajectory for meta-llama/Llama-3.1-8B-Instruct on
# SST-2, run through the media server's `ttml-training-lora` runner (tt-metal's
# tt-train SFTTrainer) on P150 (see workflows/training/registry.py).
#
# expected_losses is empty until a P150 run on an image built with
# BUILD_TT_TRAIN=true records the trajectory; until then the gate grades only
# the checks below. Regenerate whenever the tt-metal commit of the image moves.

# Hyperparameters forwarded verbatim into the TrainingRequest POST body. Kept
# small so a nightly P150 job stays bounded while still exercising the full
# submit -> train -> metrics path. Checkpointing is intentionally disabled
# (save_interval: 0 -> save_strategy "none"), so no adapter is written; this
# test only grades the loss trajectory from GET /v1/jobs/{id}/metrics.
# ttml fuses q/k/v into one projection, so LoRA targets all of them or none.
request:
  dataset_loader: SST2
  dataset_max_sequence_length: 64
  batch_size: 8
  learning_rate: 0.0001
  num_epochs: 1
  max_steps: 15
  steps_freq: 5
  val_steps_freq: 5
  save_interval: 0
  lora_r: 4
  lora_alpha: 8
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  lora_task_type: CAUSAL_LM
  dtype: torch.bfloat16
  optimizer: adamw

# Tolerances around the recorded trajectory; revisit them once it is recorded.
tolerances:
  rtol: 0.15
  atol: 0.2

checks:
  # Final training loss must not exceed the first recorded value (+atol).
  require_decreasing: true
  # Absolute ceiling on the final training loss (guards against a diverged run
  # that happens to be "decreasing"). Tune after regeneration.
  final_train_loss_max: 5.0

# Per-checkpoint expectations (steps must line up with steps_freq / val_steps_freq).
expected_losses: []
