# Model spec catalog: LLM templates.
# Edit this file to add or modify a LLM model spec.
# Schema: workflows/model_spec.py (ModelSpecTemplate, DeviceModelSpec).
templates:
# =============================================================================
# LLM templates
# =============================================================================
- weights:
    - openai/gpt-oss-20b
  impl: gpt_oss
  inference_engine: VLLM
  device_model_specs:
    - device: T3K
      max_concurrency: 1
      max_context: 16384  # 16 * 1024
      default_impl: true
      env_vars:
        VLLM_ENABLE_RESPONSES_API_STORE: 1
        VLLM_GPT_OSS_HARMONY_SYSTEM_INSTRUCTIONS: 1
    - device: GALAXY_T3K
      max_concurrency: 1
      max_context: 16384  # 16 * 1024
      default_impl: true
      env_vars:
        TT_MESH_GRAPH_DESC_PATH: "../../tt-metal/tt_metal/fabric/mesh_graph_descriptors/t3k_mesh_graph_descriptor.textproto"
    - device: GALAXY
      max_concurrency: 128  # 32 * 4
      max_context: 131072  # 128 * 1024
      default_impl: true
      env_vars:
        MESH_DEVICE: "(4, 8)"  # Override default TG->(8,4) to use (4,8) mesh grid
      vllm_args:
        data_parallel_size: 4
  status: EXPERIMENTAL
  has_builtin_warmup: true
  env_vars:
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  metadata:
    openai/gpt-oss-20b:
      reasoning_parser_name: openai_gptoss
      tool_call_parser_name: openai

- weights:
    - openai/gpt-oss-120b
  impl: gpt_oss
  inference_engine: VLLM
  device_model_specs:
    - device: T3K
      max_concurrency: 1
      max_context: 16384  # 16 * 1024
      default_impl: true
      tensor_cache_timeout: 5400.0
      override_tt_config:
        trace_region_size: 134217728  # 128 MB; vLLM default 50 MB is too small for long prefill
    - device: GALAXY
      max_concurrency: 32  # currently limiting client-side max_concurrency=32 to allow workflows to
      # complete else they will timeout due to hitting the vLLM RPC recv 30min timeout
      max_context: 131072  # 128 * 1024
      default_impl: true
      tensor_cache_timeout: 5400.0
      env_vars:
        MESH_DEVICE: "(4, 8)"  # Override default TG->(8,4) to use (4,8) mesh grid
        TT_MM_THROTTLE_PERF: 2
      vllm_args:
        data_parallel_size: 4
        max_num_seqs: 32  # override the default inferred by max_concurrency
      override_tt_config:
        sample_on_device_mode: all
        trace_region_size: 134217728  # 128 MB; vLLM default 50 MB is too small for long prefill
      known_issues:
        - workflow_type: EVALS
          task_name: aime25
          reason: "Model implementation is producing non-deterministic outputs causing this eval task to pass/fail flakily. Masking this part of the acceptance criteria due to other evals passing consistently."
        - workflow_type: EVALS
          task_name: gpqa_diamond_cot_zeroshot
          reason: "Model implementation is producing non-deterministic outputs causing this eval task to pass/fail flakily. Masking this part of the acceptance criteria due to other evals passing consistently."
    # Blackhole Galaxy (32x P150), DP=4 over a (4,8) mesh. Copied from the GALAXY
    # entry above. A bring-up config, not a validated one.
    #
    #   - MMLU: ~24% of requests failed (mostly HTTP 500 from
    #     openai_harmony.HarmonyError) and ~10% more returned garbled text.
    #     aime25 (13/15) and gpqa (7/7) ran on only 15 and 7 questions.
    #   - Benchmarks have no perf targets. The server logged 158 HarmonyError
    #     stream failures during them, yet every benchmark reports failed=0, so
    #     the numbers are not reliable.
    #   - Context was exercised up to a 64K prompt, not the full 128K.
    #
    #
    # MESH_DEVICE "(4, 8)": with the default "BH-Galaxy" name, gpt-oss-20b crashed
    # during prefill warmup (paged_fill_cache kv_heads mismatch, tt-shield
    # 35106897592). The cause was not root-caused.
    #
    - device: BLACKHOLE_GALAXY
      max_concurrency: 32  # currently limiting client-side max_concurrency=32 to allow workflows to
      # complete else they will timeout due to hitting the vLLM RPC recv 30min timeout
      max_context: 131072  # 128 * 1024
      default_impl: true
      tensor_cache_timeout: 5400.0
      env_vars:
        MESH_DEVICE: "(4, 8)"  # Override default BH-Galaxy name to use (4,8) mesh grid; see note above
        TT_MM_THROTTLE_PERF: 2
      vllm_args:
        data_parallel_size: 4
        max_num_seqs: 32  # override the default inferred by max_concurrency
        # Default to the device sampler's top-k limit. Requests can override this value.
        override_generation_config: '{"top_k": 32}'
      override_tt_config:
        sample_on_device_mode: all
        trace_region_size: 134217728  # 128 MB; vLLM default 50 MB is too small for long prefill
      known_issues:
        - workflow_type: EVALS
          task_name: aime25
          reason: "Model implementation is producing non-deterministic outputs causing this eval task to pass/fail flakily. Masking this part of the acceptance criteria due to other evals passing consistently."
        - workflow_type: EVALS
          task_name: gpqa_diamond_cot_zeroshot
          reason: "Model implementation is producing non-deterministic outputs causing this eval task to pass/fail flakily. Masking this part of the acceptance criteria due to other evals passing consistently."
  status: EXPERIMENTAL
  has_builtin_warmup: true
  env_vars:
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  metadata:
    openai/gpt-oss-120b:
      reasoning_parser_name: openai_gptoss
      tool_call_parser_name: openai

