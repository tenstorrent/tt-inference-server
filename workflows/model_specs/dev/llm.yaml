- weights:
    - google/gemma-4-31B-it
  impl: tt_transformers
  # Dev specs omit tt_metal_commit/vllm_commit (base ModelSpecTemplate rejects
  # them; only prod specs carry commits). The image is supplied at runtime via
  # --override-docker-image; the prod gemma4 specs pin the build commits.
  inference_engine: VLLM
  device_model_specs:
    - device: P300X2  # QB2 (2x P300, 4-chip TP mesh)
      # Decode batch ceiling is 32 (metal batch-32 demo). Prefill is still
      # micro-batched ≤4 users inside the generator.
      max_concurrency: 32
      # Metal policy (generator_trace 31B/_QB2): auto-bounded at ≥64k; at
      # ISL≥128k + bounded → chunk 2048 (coherency). Serve 256k with that path.
      # Scheduler tokens must match the resolved metal chunk (2048 here).
      max_context: 262144  # 256 * 1024
      default_impl: true  # validated tt-transformers entry (32 users, 256K); the gemma4_31b_qb2 class below needs an unmerged tt-metal branch
      env_vars:
        # QB2's 4 Blackhole chips are driven as a P150x4 (1,4) mesh — matches the
        # passing vLLM nightly [BH-QB-2] Gemma4 entry. The custom p300_x2 descriptor
        # laid the TP collectives over the wrong fabric links and corrupted decode
        # logits; the default p150_x4 descriptor (selected from MESH_DEVICE) is correct.
        MESH_DEVICE: "P150x4"
        GEMMA4_CCL_TOPOLOGY: "linear"
        GEMMA4_PAGE_BLOCK_SIZE: "64"
        GEMMA4_MAX_TOKENS_ALL_USERS: "393216"  # one 256K request + sliding-group charges
        GEMMA4_KV_BFP8: "1"
        GEMMA4_VLLM_SINGLE_CHUNK: "0"
        # Prefix caching needs vLLM-managed sliding KV (hybrid kv-cache groups), so the
        # bounded device rings stay off; chunked prefill stays untraced on this path.
        GEMMA4_HYBRID_KV_CACHE_GROUPS: "1"
        GEMMA4_BOUNDED_SLIDING_KV_CACHE: "0"
        GEMMA4_PREFIX_CACHING: "1"
        GEMMA4_CHUNKED_PREFILL_TRACE: "0"
      override_tt_config:
        fabric_config: FABRIC_1D
        trace_region_size: 512000000
        l1_small_size: 24576  # all_gather semaphores into L1_SMALL; without it QB2 31B wedges at conc=32 (metal demo parity)
        # On-device decode sampling is required on the TP mesh so token ids
        # >= 65536 are reachable (host sampling only sees device 0's vocab shard).
        sample_on_device_mode: decode_only
      vllm_args:
        # Overlap host schedule with device decode (metal supports_async_decode; #51186).
        async_scheduling: true
        # Sampling defaults come from the HF generation_config; the gemma4 tool
        # parser ships in vllm-tt-plugin.
        enable-auto-tool-choice: true
        tool-call-parser: gemma4
        # Thinking on: the reasoning evals need the thought channel (~10 pts otherwise).
        default-chat-template-kwargs: '{"enable_thinking": true}'
        reasoning-parser: gemma4
        # Token-chunked prefill (tenstorrent/vllm#448). Parity with the 12B spec
        # (config-shadows lesson): the earlier 2048/2048 here was the shadow that
        # produced the invalidated "19/32 coherent @ 0.8 tok/s/u" b32 number --
        # chunked 4k prompts hit pre-gate batched prefill and 32x more scheduler
        # rounds starved decode under async scheduling. 65536/4096 measured
        # coherent and faster on QB2/LB (2026-08-31 battery; galaxy re-run 09-01).
        enable_chunked_prefill: true
        # Under hybrid kv-cache groups vLLM charges each sliding group window + in-flight
        # tokens per request; 65536 could not fit one 256K request (56 GiB "needed").
        max_num_batched_tokens: 16384
        long_prefill_token_threshold: 4096
    # LoudBox (8x P150). Metal policy: unbounded through 64k; auto-bounded at
    # ≥128k (generator_trace). Prefill chunk default 4096; at ≥128k + bounded
    # → 2048. Scheduler tokens stay 2048 to match metal at long ISL. B=32 needs
    # ≥512MB trace region.
    - device: P150X8
      max_concurrency: 32
      max_context: 262144  # 256 * 1024
      default_impl: true
      env_vars:
        MESH_DEVICE: "P150x8"
        GEMMA4_PAGE_BLOCK_SIZE: "64"
        GEMMA4_MAX_TOKENS_ALL_USERS: "262144"
        GEMMA4_VLLM_SINGLE_CHUNK: "0"
        # Explicitly clear demo single-chunk so a polluted parent shell cannot
        # force full-ISL warmup (hangs at 128k/256k on LB).
        GEMMA4_CHUNKED_PREFILL_TRACE: "1"
      override_tt_config:
        fabric_config: FABRIC_1D
        trace_region_size: 512000000
        l1_small_size: 24576  # all_gather semaphores into L1_SMALL; without it QB2 31B wedges at conc=32 (metal demo parity)
        # On-device decode sampling required on TP so token ids >= 65536 are
        # reachable (host sampling only sees device 0's vocab shard).
        sample_on_device_mode: decode_only
      vllm_args:
        # Overlap host schedule with device decode (metal supports_async_decode; #51186).
        async_scheduling: true
        enable-auto-tool-choice: true
        tool-call-parser: gemma4
        default-chat-template-kwargs: '{"enable_thinking": true}'
        reasoning-parser: gemma4
        # Token-chunked prefill (tenstorrent/vllm#448). Parity with the 12B spec
        # (config-shadows lesson): the earlier 2048/2048 here was the shadow that
        # produced the invalidated "19/32 coherent @ 0.8 tok/s/u" b32 number --
        # chunked 4k prompts hit pre-gate batched prefill and 32x more scheduler
        # rounds starved decode under async scheduling. 65536/4096 measured
        # coherent and faster on QB2/LB (2026-08-31 battery; galaxy re-run 09-01).
        enable_chunked_prefill: true
        max_num_batched_tokens: 65536
        long_prefill_token_threshold: 4096
    # BH Galaxy DP=4: four (1,8) column engines via standard-DP discovery
    # (TT_VISIBLE_DEVICES per rank, no descriptor override).
    - device: BLACKHOLE_GALAXY
      max_concurrency: 128  # 32 x 4 engines
      max_context: 262144
      default_impl: true
      env_vars:
        GEMMA4_CCL_TOPOLOGY: "linear"  # the galaxy column ring is unmeasured
        GEMMA4_PAGE_BLOCK_SIZE: "64"
        # 6 x 256K users per engine (24 per Galaxy); bfloat8_b KV halves pool bytes.
        GEMMA4_MAX_TOKENS_ALL_USERS: "1523712"
        GEMMA4_KV_BFP8: "1"
        # Decode graphs for 1, 4, 8 and 32 residents: the fastest set measured (2-8 residents per
        # engine decode up to 2x faster than in the 32-row graph alone). Seeded requests must
        # reproduce whichever graph they decode in (spec test_non_uniform_seeding at DP=4), so two
        # things are held identical across the graphs (tt-metal#59300, measured 2026-10-06 22/22):
        #  - RoPE: the batch-1 graph used a different op than the wider graphs (PCC 0.99999, not
        #    bitwise); GEMMA4_ROPE_PERUSER_B1 keeps every graph on the elementwise form.
        #  - Decode SDPA core split: the op splits its cores per padded row, so each graph reduced
        #    a row in a different order; GEMMA4_SDPA_MAX_CORES_PER_HEAD pins the split to the
        #    widest graph's value (3 on 110 cores, one kv head per device). Cost: a lone user's
        #    decode is -29% at 64K and -43% at 128K prompts (none at <=4K, 8 users unchanged);
        #    a reduction order fixed by the KV chunks (kernel follow-up) removes that cost.
        GEMMA4_DECODE_WARMUP_BATCHES: "1,4,8,32"
        GEMMA4_ROPE_PERUSER_B1: "1"
        GEMMA4_SDPA_MAX_CORES_PER_HEAD: "3"
        GEMMA4_VLLM_SINGLE_CHUNK: "0"
        # Prefix caching needs vLLM-managed sliding KV (hybrid kv-cache groups), so the
        # bounded device rings stay off. Traced chunked prefill still carries one chunk
        # table for all layers; keep it untraced until per-layer traced chunk tables land.
        GEMMA4_HYBRID_KV_CACHE_GROUPS: "1"
        GEMMA4_BOUNDED_SLIDING_KV_CACHE: "0"
        GEMMA4_PREFIX_CACHING: "1"
        GEMMA4_CHUNKED_PREFILL_TRACE: "0"
      override_tt_config:
        fabric_config: FABRIC_1D
        trace_region_size: 960000000  # four resident decode-bucket traces
        l1_small_size: 24576
        sample_on_device_mode: decode_only  # host sampling (logprobs etc.) is correct but slower
      vllm_args:
        data_parallel_size: 4
        max_num_seqs: 32  # per-engine; max_concurrency above is whole-box
        # Overlap host schedule with device decode (metal supports_async_decode; #51186).
        async_scheduling: true
        enable-auto-tool-choice: true
        tool-call-parser: gemma4
        default-chat-template-kwargs: '{"enable_thinking": true}'
        reasoning-parser: gemma4
        # Token-chunked prefill. vLLM charges each sliding-window group
        # window + max_num_batched_tokens per request, so the 65536 budget used
        # elsewhere would reserve the whole context per request under hybrid groups.
        enable_chunked_prefill: true
        max_num_batched_tokens: 16384
        long_prefill_token_threshold: 4096
    # GPU (H100 NVL) bring-your-own vLLM server (see docs/gpu_workflows.md); used
    # to collect GPU reference eval scores for GPQA-Diamond, Terminal-Bench 2.0,
    # and SWE-Bench Verified. Dev-only; no tt_metal_commit/version pin needed
    # (the bring-your-own-server path builds no tt-metal docker image).
    # WH T3K (1x8 = 8x n300, ~96 GB). Metal policy (generator_trace 31B/T3K):
    # unbounded through 16k, auto-bounded + multi-chunk (2048) from 32k. Measured
    # batch-1 on a real T3K: 4k TTFT 8.5 s / 15.7 tok/s, 32k 55 s / 14.8 tok/s,
    # 128k 188 s / 12.9 tok/s, 256k 564 s / 10.1 tok/s (all PASS). Served context
    # is held at 128k: metal Direct reached 256k, but the vLLM paged pool plus
    # trace regions have not been validated that high on WH.
    - device: T3K
      # Decode batch ceiling 32, same as the Blackhole specs. max_context is the
      # whole-device KV pool (it sets both max_model_len and
      # max_tokens_all_users), so raising concurrency partitions that fixed pool
      # rather than multiplying it — 32 concurrent users share max_context
      # tokens. Wormhole's 12 GB per ASIC therefore constrains max_context
      # below, not max_concurrency here.
      max_concurrency: 32
      # Long-prose ceiling (tt-metal#55102, WH-local): deterministic garbled
      # output at specific encoded lengths >=100k on T3K. 31B verified clean at
      # 100,462 and 104,954; garbled at 100,793 / 109,857 / 127,574. The map is
      # non-monotonic, so no max_context value can express it; treat ~100k as
      # the last verified-clean prose point until the ticket closes.
      max_context: 131072  # validated on T3K; 262144 OOMs (one full-attn K pool = 270532608B x 10 layers x K+V = 5.4GB + 3.87GB weights > 12GB/chip)  # 32 * 1024 — unbounded sliding (multi-request safe)
      default_impl: true
      env_vars:
        MESH_DEVICE: "T3K"
        # Ring is a Blackhole >=8-device default only; WH must stay Linear
        # (models/demos/gemma4/tt/ccl.py default_ccl_topology).
        GEMMA4_CCL_TOPOLOGY: "linear"
        GEMMA4_PAGE_BLOCK_SIZE: "64"
        GEMMA4_MAX_TOKENS_ALL_USERS: "131072"
        GEMMA4_VLLM_SINGLE_CHUNK: "0"
        GEMMA4_CHUNKED_PREFILL_TRACE: "1"
        # KNOWN BAD ON WORMHOLE — concurrent decode returns nondeterministic
        # garbage. Measured on T3K 12B (distinct arithmetic prompts, temp 0,
        # 3 repeats): every request completes, but correctness swings run to run
        # — async OFF gave 4/4, 0/4, 0/4 at concurrency 4 and 1/8, 8/8, 8/8 at
        # concurrency 8; async ON gave 4/4, 0/4, 0/4 and 0/8, 8/8, 3/8. Only
        # concurrency 1 is stable. So max_concurrency: 32 below is the BH-parity
        # target, NOT a verified-good setting on Wormhole yet.
        #
        # async decode is pinned OFF here as a precaution, not as a proven fix:
        # across those repeats it was never worse than ON and was the only
        # config with a clean 3/3 at concurrency 1, but n=3 cannot separate it
        # from the underlying corruption. The BH async mitigations (async-ahead
        # merge, preempt gen accounting, page-table -1 pad) are BH-validated
        # only. Revisit both this flag and max_concurrency once the concurrent
        # decode corruption is root-caused on WH.
        GEMMA4_SUPPORTS_ASYNC_DECODE: "0"
      override_tt_config:
        fabric_config: FABRIC_1D
        # WH cannot afford the BH 512 MB trace region; 90 MB matches the other
        # T3K LLM specs and the raised gemma4 WH demo default. Note this only
        # fits the default {B=1, B=max} decode-trace warmup — capturing every
        # power-of-two bucket overflows it (mesh_trace.cpp TT_FATAL).
        trace_region_size: 200000000
        # On-device decode sampling is required on a TP mesh so token ids
        # >= 65536 are reachable (host sampling only sees device 0's shard).
        sample_on_device_mode: decode_only
      vllm_args:
        # No async_scheduling on Wormhole. Measured on T3K 12B at max_num_seqs 32:
        # async ON gives 32/32 correct on only 4 of 6 reps (30/32 on the other two,
        # degenerate repetition) at 377-389 tok/s aggregate, while async OFF gives
        # 32/32 on four consecutive reps at 363-383 tok/s. Identical throughput,
        # strictly worse correctness — so it is pure downside here. The platform
        # also disables it automatically once the model reports
        # supports_async_decode=False (GEMMA4_SUPPORTS_ASYNC_DECODE=0 above).
        # Re-enable together with that env once the WH async path is fixed.
        enable-auto-tool-choice: true
        tool-call-parser: gemma4
        default-chat-template-kwargs: '{"enable_thinking": true}'
        reasoning-parser: gemma4
        # Token-chunked prefill (tenstorrent/vllm#448). BH/WH parity values
        # (standing policy #1, T3K reconfigured to full BH parity 2026-08-31):
        # the parity re-run banked 9x b32@4k throughput (1.26 -> 11.7 tok/s/u)
        # and cleared the corruption bands the old 2048/2048 scheduler shadow
        # had masked.
        enable_chunked_prefill: true
        max_num_batched_tokens: 65536
        long_prefill_token_threshold: 4096
    # WH Galaxy (32x WH) DP=4 — same standard-DP mechanism as the
    # BLACKHOLE_GALAXY entry above: MESH_DEVICE (4,8) splits into four (1,8)
    # engines, each exactly a T3K. Per-engine knobs therefore mirror the
    # validated T3K entry (12 GB/chip context cap, WH linear CCL, async decode
    # pinned off, 200 MB trace region, tt-metal#55102 prose ceiling ~100k).
    - device: GALAXY
      # Whole-box: 32 users x 4 DP engines; max_num_seqs pins per-engine.
      max_concurrency: 128
      max_context: 131072  # per engine — same 12 GB/chip cap as T3K (262144 OOMs)
      default_impl: true
      env_vars:
        MESH_DEVICE: "(4, 8)"  # Override default TG->(8,4) so DP carves (1,8) engines
        GEMMA4_CCL_TOPOLOGY: "linear"
        GEMMA4_PAGE_BLOCK_SIZE: "64"
        GEMMA4_MAX_TOKENS_ALL_USERS: "131072"
        GEMMA4_VLLM_SINGLE_CHUNK: "0"
        GEMMA4_CHUNKED_PREFILL_TRACE: "1"
        # WH concurrent-decode caveat + async pin: see the T3K entry above.
        GEMMA4_SUPPORTS_ASYNC_DECODE: "0"
      override_tt_config:
        fabric_config: FABRIC_1D
        trace_region_size: 200000000  # WH budget (see T3K note); not BH's 512 MB
        sample_on_device_mode: decode_only
      vllm_args:
        data_parallel_size: 4
        max_num_seqs: 32  # per-engine; max_concurrency above is whole-box
        # No async_scheduling on Wormhole — see the T3K entry above.
        enable-auto-tool-choice: true
        tool-call-parser: gemma4
        default-chat-template-kwargs: '{"enable_thinking": true}'
        reasoning-parser: gemma4
        enable_chunked_prefill: true
        max_num_batched_tokens: 65536
        long_prefill_token_threshold: 4096
    - device: GPU
      max_concurrency: 32
      max_context: 204800  # 200 * 1024; native ctx is 256K but a single H100 NVL (94GB, bf16 KV) caps servable ctx at ~205K (KV cache = 210,605 tokens)
      default_impl: true
