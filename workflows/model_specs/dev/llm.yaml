- weights:
    - arcee-ai/AFM-4.5B
  impl: tt_transformers
  inference_engine: VLLM
  # need to add default sampling params here because they're
  # not in generation_config.json
  # see: https://github.com/tenstorrent/tt-inference-server/issues/1066
  device_model_specs:
    - device: N300
      max_concurrency: 32
      max_context: 65536  # 64 * 1024
      default_impl: true
      vllm_args:
        override_generation_config: '{"temperature": 0.5, "top_k": 50, "top_p": 0.95}'
    - device: T3K
      max_concurrency: 32
      max_context: 65536  # 64 * 1024
      default_impl: true
      vllm_args:
        override_generation_config: '{"temperature": 0.5, "top_k": 50, "top_p": 0.95}'
  status: EXPERIMENTAL

- weights:
    - google/gemma-3-1b-it
  impl: tt_transformers
  inference_engine: VLLM
  device_model_specs:
    - device: N150
      max_concurrency: 32
      max_context: 32768  # 32 * 1024
      default_impl: true
      override_tt_config:
        l1_small_size: 4096
        fabric_config: FABRIC_1D
  status: EXPERIMENTAL
  has_builtin_warmup: true

- weights:
    - google/gemma-4-31B-it
  impl: tt_transformers
  # Dev specs omit tt_metal_commit/vllm_commit (base ModelSpecTemplate rejects
  # them; only prod specs carry commits). The image is supplied at runtime via
  # --override-docker-image; the prod gemma4 specs pin the build commits.
  inference_engine: VLLM
  device_model_specs:
    - device: P300X2  # QB2 (2x P300, 4-chip TP mesh)
      # Decode batch ceiling is 32 (metal batch-32 demo). Prefill is still
      # micro-batched ≤4 users inside the generator.
      max_concurrency: 32
      # Metal policy (generator_trace 31B/_QB2): auto-bounded at ≥64k; at
      # ISL≥128k + bounded → chunk 2048 (coherency). Serve 256k with that path.
      # Scheduler tokens must match the resolved metal chunk (2048 here).
      max_context: 262144  # 256 * 1024
      default_impl: true
      env_vars:
        # QB2's 4 Blackhole chips are driven as a P150x4 (1,4) mesh — matches the
        # passing vLLM nightly [BH-QB-2] Gemma4 entry. The custom p300_x2 descriptor
        # laid the TP collectives over the wrong fabric links and corrupted decode
        # logits; the default p150_x4 descriptor (selected from MESH_DEVICE) is correct.
        MESH_DEVICE: "P150x4"
        GEMMA4_CCL_TOPOLOGY: "linear"
        GEMMA4_PAGE_BLOCK_SIZE: "64"
        GEMMA4_MAX_TOKENS_ALL_USERS: "262144"
        GEMMA4_VLLM_SINGLE_CHUNK: "0"
        # Trace middle-chunk (sp1) path for long-ISL multi-chunk replay.
        GEMMA4_CHUNKED_PREFILL_TRACE: "1"
      override_tt_config:
        fabric_config: FABRIC_1D
        trace_region_size: 512000000
        l1_small_size: 24576  # all_gather semaphores into L1_SMALL; without it QB2 31B wedges at conc=32 (metal demo parity)
        # On-device decode sampling is required on the TP mesh so token ids
        # >= 65536 are reachable (host sampling only sees device 0's vocab shard).
        sample_on_device_mode: decode_only
      vllm_args:
        # Overlap host schedule with device decode (metal supports_async_decode; #51186).
        async_scheduling: true
        # Sampling params (temp=1.0 / top_k=64 / top_p=0.95) load from the
        # model's HF generation_config.json; evals override per-request. No
        # override_generation_config here -- it would just restate the HF default.
        # Activate the gemma4 tool_call_parser so tool_choice:"auto" clients
        # (mini-swe-agent / SWE-Bench) work on a flag-free release run. vLLM
        # requires --tool-call-parser alongside --enable-auto-tool-choice, so it
        # is passed explicitly here; the gemma4 parser is registered by the
        # vllm-tt-plugin entry point (tenstorrent/vllm #431).
        enable-auto-tool-choice: true
        tool-call-parser: gemma4
        # Enable gemma-4 thinking server-side so the r1_gpqa_diamond /
        # terminal-bench-2 / swe-bench-verified evals (methodology matched to
        # tenstorrent/tt-inference-server#4331) get the reasoning channel the
        # chat template otherwise suppresses (gemma-4 scores ~10pts lower w/o it).
        # --reasoning-parser separates the thought channel into reasoning_content.
        default-chat-template-kwargs: '{"enable_thinking": true}'
        reasoning-parser: gemma4
        # Token-chunked prefill (tenstorrent/vllm#448). Match metal 2048 @ ≥128k.
        enable_chunked_prefill: true
        max_num_batched_tokens: 2048
        long_prefill_token_threshold: 2048
    # LoudBox (8x P150). Metal policy: unbounded through 64k; auto-bounded at
    # ≥128k (generator_trace). Prefill chunk default 4096; at ≥128k + bounded
    # → 2048. Scheduler tokens stay 2048 to match metal at long ISL. B=32 needs
    # ≥512MB trace region.
    - device: P150X8
      max_concurrency: 32
      max_context: 262144  # 256 * 1024
      default_impl: true
      env_vars:
        MESH_DEVICE: "P150x8"
        GEMMA4_PAGE_BLOCK_SIZE: "64"
        GEMMA4_MAX_TOKENS_ALL_USERS: "262144"
        GEMMA4_VLLM_SINGLE_CHUNK: "0"
        # Explicitly clear demo single-chunk so a polluted parent shell cannot
        # force full-ISL warmup (hangs at 128k/256k on LB).
        GEMMA4_CHUNKED_PREFILL_TRACE: "1"
      override_tt_config:
        fabric_config: FABRIC_1D
        trace_region_size: 512000000
        l1_small_size: 24576  # all_gather semaphores into L1_SMALL; without it QB2 31B wedges at conc=32 (metal demo parity)
        # On-device decode sampling required on TP so token ids >= 65536 are
        # reachable (host sampling only sees device 0's vocab shard).
        sample_on_device_mode: decode_only
      vllm_args:
        # Overlap host schedule with device decode (metal supports_async_decode; #51186).
        async_scheduling: true
        enable-auto-tool-choice: true
        tool-call-parser: gemma4
        default-chat-template-kwargs: '{"enable_thinking": true}'
        reasoning-parser: gemma4
        # Token-chunked prefill (tenstorrent/vllm#448). Match metal 2048 @ ≥128k.
        enable_chunked_prefill: true
        max_num_batched_tokens: 2048
        long_prefill_token_threshold: 2048
    # GPU (H100 NVL) bring-your-own vLLM server (see docs/gpu_workflows.md); used
    # to collect GPU reference eval scores for GPQA-Diamond, Terminal-Bench 2.0,
    # and SWE-Bench Verified. Dev-only; no tt_metal_commit/version pin needed
    # (the bring-your-own-server path builds no tt-metal docker image).
    # WH T3K (1x8 = 8x n300, ~96 GB). Metal policy (generator_trace 31B/T3K):
    # unbounded through 16k, auto-bounded + multi-chunk (2048) from 32k. Measured
    # batch-1 on a real T3K: 4k TTFT 8.5 s / 15.7 tok/s, 32k 55 s / 14.8 tok/s,
    # 128k 188 s / 12.9 tok/s, 256k 564 s / 10.1 tok/s (all PASS). Served context
    # is held at 128k: metal Direct reached 256k, but the vLLM paged pool plus
    # trace regions have not been validated that high on WH.
    - device: T3K
      # Decode batch ceiling 32, same as the Blackhole specs. max_context is the
      # whole-device KV pool (it sets both max_model_len and
      # max_tokens_all_users), so raising concurrency partitions that fixed pool
      # rather than multiplying it — 32 concurrent users share max_context
      # tokens. Wormhole's 12 GB per ASIC therefore constrains max_context
      # below, not max_concurrency here.
      max_concurrency: 32
      max_context: 32768  # 32 * 1024 — unbounded sliding (multi-request safe)
      default_impl: true
      env_vars:
        MESH_DEVICE: "T3K"
        # Ring is a Blackhole >=8-device default only; WH must stay Linear
        # (models/demos/gemma4/tt/ccl.py default_ccl_topology).
        GEMMA4_CCL_TOPOLOGY: "linear"
        GEMMA4_PAGE_BLOCK_SIZE: "64"
        GEMMA4_MAX_TOKENS_ALL_USERS: "32768"
        GEMMA4_VLLM_SINGLE_CHUNK: "0"
        GEMMA4_CHUNKED_PREFILL_TRACE: "1"
        # KNOWN BAD ON WORMHOLE — concurrent decode returns nondeterministic
        # garbage. Measured on T3K 12B (distinct arithmetic prompts, temp 0,
        # 3 repeats): every request completes, but correctness swings run to run
        # — async OFF gave 4/4, 0/4, 0/4 at concurrency 4 and 1/8, 8/8, 8/8 at
        # concurrency 8; async ON gave 4/4, 0/4, 0/4 and 0/8, 8/8, 3/8. Only
        # concurrency 1 is stable. So max_concurrency: 32 below is the BH-parity
        # target, NOT a verified-good setting on Wormhole yet.
        #
        # async decode is pinned OFF here as a precaution, not as a proven fix:
        # across those repeats it was never worse than ON and was the only
        # config with a clean 3/3 at concurrency 1, but n=3 cannot separate it
        # from the underlying corruption. The BH async mitigations (async-ahead
        # merge, preempt gen accounting, page-table -1 pad) are BH-validated
        # only. Revisit both this flag and max_concurrency once the concurrent
        # decode corruption is root-caused on WH.
        GEMMA4_SUPPORTS_ASYNC_DECODE: "0"
      override_tt_config:
        fabric_config: FABRIC_1D
        # WH cannot afford the BH 512 MB trace region; 90 MB matches the other
        # T3K LLM specs and the raised gemma4 WH demo default. Note this only
        # fits the default {B=1, B=max} decode-trace warmup — capturing every
        # power-of-two bucket overflows it (mesh_trace.cpp TT_FATAL).
        trace_region_size: 200000000
        # On-device decode sampling is required on a TP mesh so token ids
        # >= 65536 are reachable (host sampling only sees device 0's shard).
        sample_on_device_mode: decode_only
      vllm_args:
        # No async_scheduling on Wormhole. Measured on T3K 12B at max_num_seqs 32:
        # async ON gives 32/32 correct on only 4 of 6 reps (30/32 on the other two,
        # degenerate repetition) at 377-389 tok/s aggregate, while async OFF gives
        # 32/32 on four consecutive reps at 363-383 tok/s. Identical throughput,
        # strictly worse correctness — so it is pure downside here. The platform
        # also disables it automatically once the model reports
        # supports_async_decode=False (GEMMA4_SUPPORTS_ASYNC_DECODE=0 above).
        # Re-enable together with that env once the WH async path is fixed.
        enable-auto-tool-choice: true
        tool-call-parser: gemma4
        default-chat-template-kwargs: '{"enable_thinking": true}'
        reasoning-parser: gemma4
        # Token-chunked prefill (tenstorrent/vllm#448). Must equal the chunk the
        # metal policy resolves for this (model, device) — 2048 on every WH board.
        enable_chunked_prefill: true
        max_num_batched_tokens: 2048
        long_prefill_token_threshold: 2048
    - device: GPU
      max_concurrency: 32
      max_context: 204800  # 200 * 1024; native ctx is 256K but a single H100 NVL (94GB, bf16 KV) caps servable ctx at ~205K (KV cache = 210,605 tokens)
      default_impl: true
  status: EXPERIMENTAL
  has_builtin_warmup: true
  env_vars:
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  metadata:
    google/gemma-4-31B-it:
      reasoning_parser_name: gemma4
      # tool parser ships in vllm-tt-plugin as of tenstorrent/vllm #431; activated
      # by enable-auto-tool-choice in vllm_args above.
      tool_call_parser_name: gemma4

- weights:
    - google/gemma-4-12B-it
  impl: tt_transformers
  # Dev specs omit tt_metal_commit/vllm_commit (base ModelSpecTemplate rejects
  # them; only prod specs carry commits). The image is supplied at runtime via
  # --override-docker-image; the prod gemma4 specs pin the build commits.
  inference_engine: VLLM
  device_model_specs:
    - device: P300X2  # QB2 (2x P300, 4-chip TP mesh)
      max_concurrency: 32
      # Metal policy (generator_trace 12B/_QB2): unbounded through 128k; auto
      # bounded + multi-chunk (4096) at 256k (unbounded 256k OOM). Match demo.
      max_context: 262144  # 256 * 1024
      default_impl: true
      env_vars:
        # QB2's 4 Blackhole chips are driven as a P150x4 (1,4) mesh — matches the
        # passing vLLM nightly [BH-QB-2] Gemma4 entry. The custom p300_x2 descriptor
        # laid the TP collectives over the wrong fabric links and corrupted decode
        # logits; the default p150_x4 descriptor (selected from MESH_DEVICE) is correct.
        MESH_DEVICE: "P150x4"
        GEMMA4_CCL_TOPOLOGY: "linear"
        GEMMA4_PAGE_BLOCK_SIZE: "64"
        GEMMA4_MAX_TOKENS_ALL_USERS: "262144"
        GEMMA4_VLLM_SINGLE_CHUNK: "0"
        GEMMA4_CHUNKED_PREFILL_TRACE: "1"
      override_tt_config:
        fabric_config: FABRIC_1D
        # B=32 decode traces (match 31B QB2 headroom).
        trace_region_size: 512000000
        l1_small_size: 24576  # all_gather semaphores into L1_SMALL; without it QB2 31B wedges at conc=32 (metal demo parity)
        sample_on_device_mode: decode_only
      vllm_args:
        # Overlap host schedule with device decode (metal supports_async_decode; #51186).
        async_scheduling: true
        # Sampling params (temp=1.0 / top_k=64 / top_p=0.95) load from the
        # model's HF generation_config.json; evals override per-request. No
        # override_generation_config here -- it would just restate the HF default.
        # Activate the gemma4 tool_call_parser so tool_choice:"auto" clients
        # (mini-swe-agent / SWE-Bench) work on a flag-free release run. vLLM
        # requires --tool-call-parser alongside --enable-auto-tool-choice, so it
        # is passed explicitly here; the gemma4 parser is registered by the
        # vllm-tt-plugin entry point (tenstorrent/vllm #431).
        enable-auto-tool-choice: true
        tool-call-parser: gemma4
        # Enable gemma-4 thinking server-side so the r1_gpqa_diamond /
        # terminal-bench-2 / swe-bench-verified evals (methodology matched to
        # tenstorrent/tt-inference-server#4331) get the reasoning channel the
        # chat template otherwise suppresses (gemma-4 scores ~10pts lower w/o it).
        # --reasoning-parser separates the thought channel into reasoning_content.
        default-chat-template-kwargs: '{"enable_thinking": true}'
        reasoning-parser: gemma4
        # Token-chunked prefill (tenstorrent/vllm#448). Match metal 4096.
        enable_chunked_prefill: true
        max_num_batched_tokens: 65536
        long_prefill_token_threshold: 4096
    # LoudBox: metal isl_sweep unbounded through 256k PASS for 12B; multi-chunk
    # prefill (4096) matches demo policy (no auto-bound until >256k).
    - device: P150X8
      max_concurrency: 32
      max_context: 262144  # 256 * 1024
      default_impl: true
      env_vars:
        MESH_DEVICE: "P150x8"
        GEMMA4_CCL_TOPOLOGY: "linear"
        GEMMA4_PAGE_BLOCK_SIZE: "64"
        # Shared KV pool; 262144 is ~max that fits P150x8 12B DRAM (524288 OOMs).
        GEMMA4_MAX_TOKENS_ALL_USERS: "262144"
        GEMMA4_VLLM_SINGLE_CHUNK: "0"
        GEMMA4_CHUNKED_PREFILL_TRACE: "1"
      override_tt_config:
        fabric_config: FABRIC_1D
        trace_region_size: 512000000
        l1_small_size: 24576  # all_gather semaphores into L1_SMALL; without it QB2 31B wedges at conc=32 (metal demo parity)
        # On-device decode sampling required on TP so token ids >= 65536 are
        # reachable (host sampling only sees device 0's vocab shard).
        sample_on_device_mode: decode_only
      vllm_args:
        # Overlap host schedule with device decode (metal supports_async_decode; #51186).
        async_scheduling: true
        enable-auto-tool-choice: true
        tool-call-parser: gemma4
        default-chat-template-kwargs: '{"enable_thinking": true}'
        reasoning-parser: gemma4
        enable_chunked_prefill: true
        # 65536 = 32 users x 2048 ISL in one prefill step. Requires the trace cap
        # aligned to the shared planner (128Ki) so wide prefill stays TRACED;
        # at 4096 the batch-2 steps starve decode (TPOT 281ms -> 35ms measured).
        max_num_batched_tokens: 65536
        long_prefill_token_threshold: 4096
    # GPU (H100 NVL) bring-your-own vLLM server (see docs/gpu_workflows.md); used
    # to collect GPU reference eval scores for GPQA-Diamond, Terminal-Bench 2.0,
    # and SWE-Bench Verified. Dev-only; no tt_metal_commit/version pin needed
    # (the bring-your-own-server path builds no tt-metal docker image).
    # WH T3K (1x8 = 8x n300, ~96 GB). Metal policy (generator_trace 12B/T3K):
    # unbounded through 8k, auto-bounded + multi-chunk (2048) above that. Measured
    # batch-1 on a real T3K: 4k TTFT 9.9 s / 24.0 tok/s, 32k 49 s / 22.5 tok/s,
    # 128k 163 s / 19.1 tok/s, 256k 468 s / 14.3 tok/s — the full HF ISL PASSES.
    - device: T3K
      # Decode batch ceiling 32, same as the Blackhole specs. max_context is the
      # whole-device KV pool (it sets both max_model_len and
      # max_tokens_all_users), so raising concurrency partitions that fixed pool
      # rather than multiplying it — 32 concurrent users share max_context
      # tokens. Wormhole's 12 GB per ASIC therefore constrains max_context
      # below, not max_concurrency here.
      max_concurrency: 32
      max_context: 131072  # 128 * 1024 — unbounded sliding (see comment)
      default_impl: true
      env_vars:
        MESH_DEVICE: "T3K"
        # Ring is a Blackhole >=8-device default only; WH must stay Linear
        # (models/demos/gemma4/tt/ccl.py default_ccl_topology).
        GEMMA4_CCL_TOPOLOGY: "linear"
        GEMMA4_PAGE_BLOCK_SIZE: "64"
        GEMMA4_MAX_TOKENS_ALL_USERS: "131072"
        GEMMA4_VLLM_SINGLE_CHUNK: "0"
        GEMMA4_CHUNKED_PREFILL_TRACE: "1"
        # KNOWN BAD ON WORMHOLE — concurrent decode returns nondeterministic
        # garbage. Measured on T3K 12B (distinct arithmetic prompts, temp 0,
        # 3 repeats): every request completes, but correctness swings run to run
        # — async OFF gave 4/4, 0/4, 0/4 at concurrency 4 and 1/8, 8/8, 8/8 at
        # concurrency 8; async ON gave 4/4, 0/4, 0/4 and 0/8, 8/8, 3/8. Only
        # concurrency 1 is stable. So max_concurrency: 32 below is the BH-parity
        # target, NOT a verified-good setting on Wormhole yet.
        #
        # async decode is pinned OFF here as a precaution, not as a proven fix:
        # across those repeats it was never worse than ON and was the only
        # config with a clean 3/3 at concurrency 1, but n=3 cannot separate it
        # from the underlying corruption. The BH async mitigations (async-ahead
        # merge, preempt gen accounting, page-table -1 pad) are BH-validated
        # only. Revisit both this flag and max_concurrency once the concurrent
        # decode corruption is root-caused on WH.
        GEMMA4_SUPPORTS_ASYNC_DECODE: "0"
      override_tt_config:
        fabric_config: FABRIC_1D
        # WH cannot afford the BH 512 MB trace region; 90 MB matches the other
        # T3K LLM specs and the raised gemma4 WH demo default. Note this only
        # fits the default {B=1, B=max} decode-trace warmup — capturing every
        # power-of-two bucket overflows it (mesh_trace.cpp TT_FATAL).
        trace_region_size: 200000000
        # On-device decode sampling is required on a TP mesh so token ids
        # >= 65536 are reachable (host sampling only sees device 0's shard).
        sample_on_device_mode: decode_only
      vllm_args:
        # No async_scheduling on Wormhole. Measured on T3K 12B at max_num_seqs 32:
        # async ON gives 32/32 correct on only 4 of 6 reps (30/32 on the other two,
        # degenerate repetition) at 377-389 tok/s aggregate, while async OFF gives
        # 32/32 on four consecutive reps at 363-383 tok/s. Identical throughput,
        # strictly worse correctness — so it is pure downside here. The platform
        # also disables it automatically once the model reports
        # supports_async_decode=False (GEMMA4_SUPPORTS_ASYNC_DECODE=0 above).
        # Re-enable together with that env once the WH async path is fixed.
        enable-auto-tool-choice: true
        tool-call-parser: gemma4
        default-chat-template-kwargs: '{"enable_thinking": true}'
        reasoning-parser: gemma4
        # Token-chunked prefill (tenstorrent/vllm#448). Must equal the chunk the
        # metal policy resolves for this (model, device) — 2048 on every WH board.
        enable_chunked_prefill: true
        max_num_batched_tokens: 2048
        long_prefill_token_threshold: 2048
    # WH N300 (1x2 = one n300 card, 24 GB). 12B is the only Gemma4 variant that
    # fits a single WH card — 26B-A4B and 31B OOM here even at 4k. Measured
    # batch-1: 4k TTFT 11.4 s / 12.0 tok/s, 32k 60 s / 12.7 tok/s, 64k 99 s /
    # 12.3 tok/s, 128k 171 s / 11.7 tok/s. 256k OOMs on KV allocation, so 128k
    # is the ceiling here (unlike T3K).
    - device: N300
      # Decode batch ceiling 32, same as the Blackhole specs. max_context is the
      # whole-device KV pool (it sets both max_model_len and
      # max_tokens_all_users), so raising concurrency partitions that fixed pool
      # rather than multiplying it — 32 concurrent users share max_context
      # tokens. Wormhole's 12 GB per ASIC therefore constrains max_context
      # below, not max_concurrency here.
      max_concurrency: 32
      max_context: 8192  # 8 * 1024 — unbounded sliding ceiling on a 24 GB card
      default_impl: true
      env_vars:
        MESH_DEVICE: "N300"
        # Ring is a Blackhole >=8-device default only; WH must stay Linear
        # (models/demos/gemma4/tt/ccl.py default_ccl_topology).
        GEMMA4_CCL_TOPOLOGY: "linear"
        GEMMA4_PAGE_BLOCK_SIZE: "64"
        GEMMA4_MAX_TOKENS_ALL_USERS: "8192"
        GEMMA4_VLLM_SINGLE_CHUNK: "0"
        GEMMA4_CHUNKED_PREFILL_TRACE: "1"
        # KNOWN BAD ON WORMHOLE — concurrent decode returns nondeterministic
        # garbage. Measured on T3K 12B (distinct arithmetic prompts, temp 0,
        # 3 repeats): every request completes, but correctness swings run to run
        # — async OFF gave 4/4, 0/4, 0/4 at concurrency 4 and 1/8, 8/8, 8/8 at
        # concurrency 8; async ON gave 4/4, 0/4, 0/4 and 0/8, 8/8, 3/8. Only
        # concurrency 1 is stable. So max_concurrency: 32 below is the BH-parity
        # target, NOT a verified-good setting on Wormhole yet.
        #
        # async decode is pinned OFF here as a precaution, not as a proven fix:
        # across those repeats it was never worse than ON and was the only
        # config with a clean 3/3 at concurrency 1, but n=3 cannot separate it
        # from the underlying corruption. The BH async mitigations (async-ahead
        # merge, preempt gen accounting, page-table -1 pad) are BH-validated
        # only. Revisit both this flag and max_concurrency once the concurrent
        # decode corruption is root-caused on WH.
        GEMMA4_SUPPORTS_ASYNC_DECODE: "0"
      override_tt_config:
        fabric_config: FABRIC_1D
        # WH cannot afford the BH 512 MB trace region; 90 MB matches the other
        # T3K LLM specs and the raised gemma4 WH demo default. Note this only
        # fits the default {B=1, B=max} decode-trace warmup — capturing every
        # power-of-two bucket overflows it (mesh_trace.cpp TT_FATAL).
        trace_region_size: 200000000
        # NO sample_on_device_mode here (unlike every other Gemma4 spec):
        # Gemma4's vocab is 262144, and on-device sampling needs the per-device
        # shard to fit ttnn topk's 64k width. TP=2 shards to 131072, so
        # Gemma4Model never builds a SamplingGenerator and requesting
        # decode_only killed the engine on the "self.sampling is not None"
        # assert. Host sampling all-gathers the full vocab and is correct here.
      vllm_args:
        # No async_scheduling on Wormhole. Measured on T3K 12B at max_num_seqs 32:
        # async ON gives 32/32 correct on only 4 of 6 reps (30/32 on the other two,
        # degenerate repetition) at 377-389 tok/s aggregate, while async OFF gives
        # 32/32 on four consecutive reps at 363-383 tok/s. Identical throughput,
        # strictly worse correctness — so it is pure downside here. The platform
        # also disables it automatically once the model reports
        # supports_async_decode=False (GEMMA4_SUPPORTS_ASYNC_DECODE=0 above).
        # Re-enable together with that env once the WH async path is fixed.
        enable-auto-tool-choice: true
        tool-call-parser: gemma4
        default-chat-template-kwargs: '{"enable_thinking": true}'
        reasoning-parser: gemma4
        # Token-chunked prefill (tenstorrent/vllm#448). Must equal the chunk the
        # metal policy resolves for this (model, device) — 2048 on every WH board.
        enable_chunked_prefill: true
        max_num_batched_tokens: 2048
        long_prefill_token_threshold: 2048
    - device: GPU
      max_concurrency: 32
      max_context: 204800  # 200 * 1024; native ctx is 256K but a single H100 NVL caps ~205K
      default_impl: true
  status: EXPERIMENTAL
  has_builtin_warmup: true
  env_vars:
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  metadata:
    google/gemma-4-12B-it:
      reasoning_parser_name: gemma4
      # tool parser ships in vllm-tt-plugin as of tenstorrent/vllm #431; activated
      # by enable-auto-tool-choice in vllm_args above.
      tool_call_parser_name: gemma4

- weights:
    - google/diffusiongemma-26B-A4B-it
  impl: diffusion_gemma
  inference_engine: VLLM
  device_model_specs:
    - device: P300X2
      max_concurrency: 1
      # Validated on QB2 from short prompts through 250K with one shared 4K
      # prefill program.
      # DeviceModelSpec derives block_size=64, max_num_seqs=1 and
      # max_num_batched_tokens=max_context from these fields.
      max_context: 262144
      default_impl: true
      env_vars:
        MESH_DEVICE: "P150x4"
        VLLM_RPC_TIMEOUT: "1800000"
        VLLM_ENABLE_V1_MULTIPROCESSING: "0"
        DISABLE_METAL_OP_TIMEOUT: "1"
        DG_VLLM_GUMBEL_MODE: "device"
        DG_UPFRONT_CAPTURE: "1"
        DG_MODEL_OWNED_HYBRID_KV: "1"
        DG_UPFRONT_COARSE_PREFILL_BUCKETS: "1"
        DG_UPFRONT_LAZY_PREFILL_RECAPTURE: "1"
        # Reuse one bounded 4K prefill program for every prompt length. This
        # prevents cold bucket recapture after long agent histories fragment DRAM.
        DG_PREFILL_FIXED_CHUNKS: "1"
        DG_PREFILL_CHUNK_SIZE: "4096"
        # A 2048-token ragged-MoE slice needs a 176 MiB embedding output.
        # After a 118-turn Terminal-Bench trial fragmented DRAM, its 23 MiB
        # per-bank allocation killed EngineCore despite 1.30 GiB total free.
        # Halving the bounded inner slice keeps the same per-token computation
        # while reducing that contiguous allocation to 11 MiB per bank.
        DG_PREFILL_RAGGED_CHUNK: "1024"
        DG_DENOISE_REVEAL_PMAX: "262144"
        DG_DENOISE_SLIDING_WINDOW: "1"
        # Warm representative short lengths before capturing the shared program.
        DG_UPFRONT_PREFILL_WARMUP_LENS: "32,64,96"
        DG_TRACE_REGION_SIZE: "3758096384"
      override_tt_config:
        sample_on_device_mode: all
        enable_model_warmup: true
        trace_mode: all
        trace_region_size: 3758096384
      vllm_args:
        generation-config: vllm
        default-chat-template-kwargs: '{"enable_thinking": true}'
        # vLLM 0.24 enables these generative defaults before the TT platform
        # hook runs. DiffusionGemma owns whole-prompt prefill/KV and emits
        # synchronous 256-token blocks, so reject the defaults at CLI parsing.
        no-enable-prefix-caching: true
        no-enable-chunked-prefill: true
        no-async-scheduling: true
        # Deliberately omit --reasoning-parser for scored GPQA runs. vLLM 0.24
        # honors the parser's request to retain <channel|> delimiters, which can
        # move the boxed answer from message.content into message.reasoning.
        # lm-eval scores content only; parser-off preserves the validated answer
        # bytes while keeping the model's thinking chat template enabled.
  status: EXPERIMENTAL
  has_builtin_warmup: true
  env_vars:
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  metadata:
    google/diffusiongemma-26B-A4B-it:
      tokenizer_trust_remote_code: true
      output_block_size: 256
      # A request must leave one full output canvas inside max_context.
      max_effective_input_tokens: 261888

