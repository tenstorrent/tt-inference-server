- weights:
    - google/gemma-4-12B-it
  impl: tt_transformers
  # Dev specs omit tt_metal_commit/vllm_commit (base ModelSpecTemplate rejects
  # them; only prod specs carry commits). The image is supplied at runtime via
  # --override-docker-image; the prod gemma4 specs pin the build commits.
  inference_engine: VLLM
  device_model_specs:
    - device: P150X8
      max_concurrency: 32
      max_context: 262144  # 256 * 1024
      default_impl: true
      env_vars:
        MESH_DEVICE: "P150x8"
        # 2026-09-02 prefill-config flip — THIS ENTRY ONLY (12B/P150x8):
        # gated sequential+traced prefill deterministically wedges this
        # quadrant under mixed prefill+decode (G7: 512-bucket trace replay,
        # NOC1 stall at the sampling eltwise; benchmark sweep cannot finish).
        # Bounded sliding disables prefill traces (no wedge class; ~87%
        # sliding-KV freed) and batched prefill recovers short-ISL conc32
        # TTFT (-68..-77%); full target sweep 24/24 at gated perf parity.
        # KNOWN ISSUE (all bounded configs, open): ~1-3/32 outputs at
        # conc32 small-ISL bursts after a prior wave show near-miss/stale
        # corruption (wave-boundary ring/trace staleness family; repro:
        # ~/g4cov/wave_smoke.sh). Gated cannot serve these shapes at all,
        # so this is a strict availability improvement for this quadrant.
        # Other gemma-4 BH entries stay gated until that issue is fixed.
        G4_FORCE_BATCH_PREFILL: "1"
        GEMMA4_BOUNDED_SLIDING_KV_CACHE: "1"
        GEMMA4_CCL_TOPOLOGY: "linear"
        GEMMA4_PAGE_BLOCK_SIZE: "64"
        # Shared KV pool; 262144 is ~max that fits P150x8 12B DRAM (524288 OOMs).
        GEMMA4_MAX_TOKENS_ALL_USERS: "262144"
        GEMMA4_VLLM_SINGLE_CHUNK: "0"
        GEMMA4_CHUNKED_PREFILL_TRACE: "0"  # eager chunks: no prefill traces under bounded (see note)
      override_tt_config:
        fabric_config: FABRIC_1D
        trace_region_size: 512000000
        l1_small_size: 24576  # all_gather semaphores into L1_SMALL; without it QB2 31B wedges at conc=32 (metal demo parity)
        # On-device decode sampling required on TP so token ids >= 65536 are
        # reachable (host sampling only sees device 0's vocab shard).
        sample_on_device_mode: decode_only
      vllm_args:
        # Overlap host schedule with device decode (metal supports_async_decode; #51186).
        async_scheduling: true
        enable-auto-tool-choice: true
        tool-call-parser: gemma4
        default-chat-template-kwargs: '{"enable_thinking": true}'
        reasoning-parser: gemma4
        enable_chunked_prefill: true
        # 65536 = 32 users x 2048 ISL in one prefill step. Requires the trace cap
        # aligned to the shared planner (128Ki) so wide prefill stays TRACED;
        # at 4096 the batch-2 steps starve decode (TPOT 281ms -> 35ms measured).
        max_num_batched_tokens: 65536
        long_prefill_token_threshold: 4096
    # GPU (H100 NVL) bring-your-own vLLM server (see docs/gpu_workflows.md); used
    # to collect GPU reference eval scores for GPQA-Diamond, Terminal-Bench 2.0,
    # and SWE-Bench Verified. Dev-only; no tt_metal_commit/version pin needed
    # (the bring-your-own-server path builds no tt-metal docker image).
    # WH T3K (1x8 = 8x n300, ~96 GB). Metal policy (generator_trace 12B/T3K):
    # unbounded through 8k, auto-bounded + multi-chunk (2048) above that. Measured
    # batch-1 on a real T3K: 4k TTFT 9.9 s / 24.0 tok/s, 32k 49 s / 22.5 tok/s,
    # 128k 163 s / 19.1 tok/s, 256k 468 s / 14.3 tok/s — the full HF ISL PASSES.
    - device: T3K
      # Decode batch ceiling 32, same as the Blackhole specs. max_context is the
      # whole-device KV pool (it sets both max_model_len and
      # max_tokens_all_users), so raising concurrency partitions that fixed pool
      # rather than multiplying it — 32 concurrent users share max_context
      # tokens. Wormhole's 12 GB per ASIC therefore constrains max_context
      # below, not max_concurrency here.
      max_concurrency: 32
      # Long-prose ceiling (tt-metal#55102, WH-local): 12B verified clean to
      # ~106k encoded; rep-divergent at ~120k, degenerate at 127,574. See 31B
      # note - non-monotonic map, ~106k is the last verified-clean prose point.
      max_context: 262144  # validated on T3K (bounded sliding): b1@256k coherent, 147s TTFT / 16.4 t/s/u; primes-verified only above ~110k (tt-metal#55102)  # 128 * 1024 — unbounded sliding (see comment)
      default_impl: true
      env_vars:
        MESH_DEVICE: "T3K"
        # 2026-09-03 flip (WH-endorsed after the T3K verification campaign):
        # gated (traced sequential prefill) wedges 12B/T3K deterministically
        # at the first b32@4k conc32 burst (G7 cross-platform; trace-bucket
        # trim does not clear it). Bounded disables prefill traces (zero
        # wedges, full battery x3 boots) and batched prefill engages (b32
        # min-TTFT 1.4s). Known issue documented on the P150X8 entry applies
        # here too: ~1-3/32 corrupt at conc32 small-ISL bursts after a prior
        # wave (wave-boundary staleness; async-independent per WH A/B).
        G4_FORCE_BATCH_PREFILL: "1"
        GEMMA4_BOUNDED_SLIDING_KV_CACHE: "1"
        # Ring is a Blackhole >=8-device default only; WH must stay Linear
        # (models/demos/gemma4/tt/ccl.py default_ccl_topology).
        GEMMA4_GEN_PREFILL_CHUNK: "4096"  # measured on T3K 12B @64k metal A/B: warm TTFT 19.8s (4096) vs 23.6s (2048), cold 35.9 vs 56.4 - matches BH direction; an earlier server-128k reading suggesting 2048 was a cold-capture artifact. NOTE: MAX_PREFILL_CHUNK_SIZE is a decoy knob for gemma4 (read by tt_transformers only); this env is the real one.
        GEMMA4_CCL_TOPOLOGY: "linear"
        GEMMA4_PAGE_BLOCK_SIZE: "64"
        GEMMA4_MAX_TOKENS_ALL_USERS: "262144"
        GEMMA4_VLLM_SINGLE_CHUNK: "0"
        GEMMA4_CHUNKED_PREFILL_TRACE: "0"  # inert under bounded (prefill traces disabled); pinned 0 to mirror the P150X8 entry
        # KNOWN BAD ON WORMHOLE — concurrent decode returns nondeterministic
        # garbage. Measured on T3K 12B (distinct arithmetic prompts, temp 0,
        # 3 repeats): every request completes, but correctness swings run to run
        # — async OFF gave 4/4, 0/4, 0/4 at concurrency 4 and 1/8, 8/8, 8/8 at
        # concurrency 8; async ON gave 4/4, 0/4, 0/4 and 0/8, 8/8, 3/8. Only
        # concurrency 1 is stable. So max_concurrency: 32 below is the BH-parity
        # target, NOT a verified-good setting on Wormhole yet.
        #
        # async decode is pinned OFF here as a precaution, not as a proven fix:
        # across those repeats it was never worse than ON and was the only
        # config with a clean 3/3 at concurrency 1, but n=3 cannot separate it
        # from the underlying corruption. The BH async mitigations (async-ahead
        # merge, preempt gen accounting, page-table -1 pad) are BH-validated
        # only. Revisit both this flag and max_concurrency once the concurrent
        # decode corruption is root-caused on WH.
        GEMMA4_SUPPORTS_ASYNC_DECODE: "0"
      override_tt_config:
        fabric_config: FABRIC_1D
        # WH cannot afford the BH 512 MB trace region; 90 MB matches the other
        # T3K LLM specs and the raised gemma4 WH demo default. Note this only
        # fits the default {B=1, B=max} decode-trace warmup — capturing every
        # power-of-two bucket overflows it (mesh_trace.cpp TT_FATAL).
        trace_region_size: 200000000
        # On-device decode sampling is required on a TP mesh so token ids
        # >= 65536 are reachable (host sampling only sees device 0's shard).
        sample_on_device_mode: decode_only
      vllm_args:
        # No async_scheduling on Wormhole. Measured on T3K 12B at max_num_seqs 32:
        # async ON gives 32/32 correct on only 4 of 6 reps (30/32 on the other two,
        # degenerate repetition) at 377-389 tok/s aggregate, while async OFF gives
        # 32/32 on four consecutive reps at 363-383 tok/s. Identical throughput,
        # strictly worse correctness — so it is pure downside here. The platform
        # also disables it automatically once the model reports
        # supports_async_decode=False (GEMMA4_SUPPORTS_ASYNC_DECODE=0 above).
        # Re-enable together with that env once the WH async path is fixed.
        enable-auto-tool-choice: true
        tool-call-parser: gemma4
        default-chat-template-kwargs: '{"enable_thinking": true}'
        reasoning-parser: gemma4
        # Token-chunked prefill (tenstorrent/vllm#448). BH/WH parity values
        # (standing policy #1, T3K reconfigured to full BH parity 2026-08-31):
        # the parity re-run banked 9x b32@4k throughput (1.26 -> 11.7 tok/s/u)
        # and cleared the corruption bands the old 2048/2048 scheduler shadow
        # had masked.
        enable_chunked_prefill: true
        max_num_batched_tokens: 65536
        long_prefill_token_threshold: 4096
    # WH Galaxy (32x WH) DP=4 — four (1,8) T3K-shaped engines (see the 31B
    # GALAXY entry for the mechanism). Per-engine knobs mirror the validated
    # 12B T3K entry above: bounded sliding + batched prefill (gated/traced
    # prefill wedges 12B on 1x8 — G7, cross-platform), chunk 4096, WH linear
    # CCL and async decode pinned off; same conc32 wave-boundary known issue.
    - device: GALAXY
      # Whole-box: 32 users x 4 DP engines; max_num_seqs pins per-engine.
      max_concurrency: 128
      max_context: 262144  # per engine — T3K-validated (bounded sliding); prose primes-verified only above ~110k (tt-metal#55102)
      default_impl: true
      env_vars:
        MESH_DEVICE: "(4, 8)"  # Override default TG->(8,4) so DP carves (1,8) engines
        G4_FORCE_BATCH_PREFILL: "1"
        GEMMA4_BOUNDED_SLIDING_KV_CACHE: "1"
        GEMMA4_GEN_PREFILL_CHUNK: "4096"  # T3K-measured optimum (see T3K entry)
        GEMMA4_CCL_TOPOLOGY: "linear"
        GEMMA4_PAGE_BLOCK_SIZE: "64"
        GEMMA4_MAX_TOKENS_ALL_USERS: "262144"
        GEMMA4_VLLM_SINGLE_CHUNK: "0"
        GEMMA4_CHUNKED_PREFILL_TRACE: "0"  # inert under bounded; pinned 0 to mirror T3K/P150X8
        # WH concurrent-decode caveat + async pin: see the T3K entry above.
        GEMMA4_SUPPORTS_ASYNC_DECODE: "0"
      override_tt_config:
        fabric_config: FABRIC_1D
        trace_region_size: 200000000  # WH budget (see T3K note); not BH's 512 MB
        sample_on_device_mode: decode_only
      vllm_args:
        data_parallel_size: 4
        max_num_seqs: 32  # per-engine; max_concurrency above is whole-box
        # No async_scheduling on Wormhole — see the T3K entry above.
        enable-auto-tool-choice: true
        tool-call-parser: gemma4
        default-chat-template-kwargs: '{"enable_thinking": true}'
        reasoning-parser: gemma4
        enable_chunked_prefill: true
        max_num_batched_tokens: 65536
        long_prefill_token_threshold: 4096
    # WH N300 (1x2 = one n300 card, 24 GB). 12B is the only Gemma4 variant that
    # fits a single WH card — 26B-A4B and 31B OOM here even at 4k. Measured
    # batch-1: 4k TTFT 11.4 s / 12.0 tok/s, 32k 60 s / 12.7 tok/s, 64k 99 s /
    # 12.3 tok/s, 128k 171 s / 11.7 tok/s. 256k OOMs on KV allocation, so 128k
    # is the ceiling here (unlike T3K).
    - device: N300
      # Decode batch ceiling 32, same as the Blackhole specs. max_context is the
      # whole-device KV pool (it sets both max_model_len and
      # max_tokens_all_users), so raising concurrency partitions that fixed pool
      # rather than multiplying it — 32 concurrent users share max_context
      # tokens. Wormhole's 12 GB per ASIC therefore constrains max_context
      # below, not max_concurrency here.
      max_concurrency: 32
      max_context: 8192  # 8 * 1024 — unbounded sliding ceiling on a 24 GB card
      default_impl: true
      env_vars:
        MESH_DEVICE: "N300"
        # Ring is a Blackhole >=8-device default only; WH must stay Linear
        # (models/demos/gemma4/tt/ccl.py default_ccl_topology).
        GEMMA4_CCL_TOPOLOGY: "linear"
        GEMMA4_PAGE_BLOCK_SIZE: "64"
        GEMMA4_MAX_TOKENS_ALL_USERS: "8192"
        GEMMA4_VLLM_SINGLE_CHUNK: "0"
        GEMMA4_CHUNKED_PREFILL_TRACE: "1"
        # KNOWN BAD ON WORMHOLE — concurrent decode returns nondeterministic
        # garbage. Measured on T3K 12B (distinct arithmetic prompts, temp 0,
        # 3 repeats): every request completes, but correctness swings run to run
        # — async OFF gave 4/4, 0/4, 0/4 at concurrency 4 and 1/8, 8/8, 8/8 at
        # concurrency 8; async ON gave 4/4, 0/4, 0/4 and 0/8, 8/8, 3/8. Only
        # concurrency 1 is stable. So max_concurrency: 32 below is the BH-parity
        # target, NOT a verified-good setting on Wormhole yet.
        #
        # async decode is pinned OFF here as a precaution, not as a proven fix:
        # across those repeats it was never worse than ON and was the only
        # config with a clean 3/3 at concurrency 1, but n=3 cannot separate it
        # from the underlying corruption. The BH async mitigations (async-ahead
        # merge, preempt gen accounting, page-table -1 pad) are BH-validated
        # only. Revisit both this flag and max_concurrency once the concurrent
        # decode corruption is root-caused on WH.
        GEMMA4_SUPPORTS_ASYNC_DECODE: "0"
      override_tt_config:
        fabric_config: FABRIC_1D
        # WH cannot afford the BH 512 MB trace region; 90 MB matches the other
        # T3K LLM specs and the raised gemma4 WH demo default. Note this only
        # fits the default {B=1, B=max} decode-trace warmup — capturing every
        # power-of-two bucket overflows it (mesh_trace.cpp TT_FATAL).
        trace_region_size: 200000000
        # NO sample_on_device_mode here (unlike every other Gemma4 spec):
        # Gemma4's vocab is 262144, and on-device sampling needs the per-device
        # shard to fit ttnn topk's 64k width. TP=2 shards to 131072, so
        # Gemma4Model never builds a SamplingGenerator and requesting
        # decode_only killed the engine on the "self.sampling is not None"
        # assert. Host sampling all-gathers the full vocab and is correct here.
      vllm_args:
        # No async_scheduling on Wormhole. Measured on T3K 12B at max_num_seqs 32:
        # async ON gives 32/32 correct on only 4 of 6 reps (30/32 on the other two,
        # degenerate repetition) at 377-389 tok/s aggregate, while async OFF gives
        # 32/32 on four consecutive reps at 363-383 tok/s. Identical throughput,
        # strictly worse correctness — so it is pure downside here. The platform
        # also disables it automatically once the model reports
        # supports_async_decode=False (GEMMA4_SUPPORTS_ASYNC_DECODE=0 above).
        # Re-enable together with that env once the WH async path is fixed.
        enable-auto-tool-choice: true
        tool-call-parser: gemma4
        default-chat-template-kwargs: '{"enable_thinking": true}'
        reasoning-parser: gemma4
        # Token-chunked prefill (tenstorrent/vllm#448). Must equal the chunk the
        # metal policy resolves for this (model, device) — 2048 on every WH board.
        enable_chunked_prefill: true
        max_num_batched_tokens: 2048
        long_prefill_token_threshold: 2048
    - device: GPU
      max_concurrency: 32
      max_context: 204800  # 200 * 1024; native ctx is 256K but a single H100 NVL caps ~205K
      default_impl: true
  status: EXPERIMENTAL
  has_builtin_warmup: true
  env_vars:
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  metadata:
    google/gemma-4-12B-it:
      reasoning_parser_name: gemma4
      tool_call_parser_name: gemma4

# P300X2 and Blackhole Galaxy are graded on this entry (COMPLETE); the other devices of
# this weights+impl keep their own status on the entry above.
- weights:
    - google/gemma-4-12B-it
  impl: tt_transformers
  inference_engine: VLLM
  device_model_specs:
    - device: P300X2  # QB2 (2x P300, 4-chip TP mesh)
      max_concurrency: 32
      max_context: 262144  # auto-bounded sliding + chunk 4096 at 256k (metal policy)
      default_impl: true
      env_vars:
        # P150x4 (1,4) mesh: the custom p300_x2 descriptor corrupted decode logits.
        MESH_DEVICE: "P150x4"
        GEMMA4_CCL_TOPOLOGY: "linear"
        GEMMA4_PAGE_BLOCK_SIZE: "64"
        # 2x the 31B QB2 pool (8 full layers x 8 KV heads vs 10 x 16); bfloat8_b KV as on Galaxy.
        GEMMA4_MAX_TOKENS_ALL_USERS: "786432"
        GEMMA4_KV_BFP8: "1"
        GEMMA4_VLLM_SINGLE_CHUNK: "0"
        # Prefix caching needs vLLM-managed sliding KV (hybrid kv-cache groups), so the
        # bounded device rings stay off; chunked prefill stays untraced on this path.
        GEMMA4_HYBRID_KV_CACHE_GROUPS: "1"
        GEMMA4_BOUNDED_SLIDING_KV_CACHE: "0"
        GEMMA4_PREFIX_CACHING: "1"
        GEMMA4_CHUNKED_PREFILL_TRACE: "0"
      override_tt_config:
        fabric_config: FABRIC_1D
        trace_region_size: 512000000
        l1_small_size: 24576  # all_gather semaphores into L1_SMALL; without it QB2 31B wedges at conc=32 (metal demo parity)
        sample_on_device_mode: decode_only
      vllm_args:
        # Overlap host schedule with device decode (metal supports_async_decode; #51186).
        async_scheduling: true
        # Sampling defaults come from the HF generation_config; the gemma4 tool
        # parser ships in vllm-tt-plugin.
        enable-auto-tool-choice: true
        tool-call-parser: gemma4
        # Thinking on: the reasoning evals need the thought channel (~10 pts otherwise).
        default-chat-template-kwargs: '{"enable_thinking": true}'
        reasoning-parser: gemma4
        enable_chunked_prefill: true
        # Under hybrid kv-cache groups vLLM charges each sliding group window + in-flight
        # tokens per request; 65536 could not fit one 256K request (56 GiB "needed").
        max_num_batched_tokens: 16384
        long_prefill_token_threshold: 4096
    # BH Galaxy (32x P150) native, DP=4 (2026-09-03 bring-up): four physical-
    # column (1,8) engines via the plugin's standard-DP discovery (see the 31B
    # BLACKHOLE_GALAXY entry for the mechanism and gates). Config mirrors the
    # 12B P150X8 target entry: bounded sliding + batched prefill + eager 4k
    # chunks — gated/traced prefill wedges 12B under mixed prefill+decode
    # concurrency (G7, cross-platform); same known wave-boundary issue applies.
    - device: BLACKHOLE_GALAXY
      # Whole-box concurrency: 32 users x 4 DP engines. max_num_seqs below
      # pins the per-engine ceiling (default inference would give 128/engine).
      max_concurrency: 128
      max_context: 262144  # 256 * 1024 per engine (same budget as P150X8)
      default_impl: true
      env_vars:
        GEMMA4_DECODE_WARMUP_BATCHES: "1,4,8,32"  # as on the 31B Galaxy entry (see its comment on seeding)
        GEMMA4_ROPE_PERUSER_B1: "1"
        GEMMA4_SDPA_MAX_CORES_PER_HEAD: "3"  # 110 cores / 32 rows, one kv head per device at TP=8
        GEMMA4_CCL_TOPOLOGY: "linear"
        GEMMA4_PAGE_BLOCK_SIZE: "64"
        # 12 x 256K users per engine (2x the 31B pool: 8 full layers x 8 KV heads vs 10 x 16);
        # 11 x 256K users per engine (44 per Galaxy); bfloat8_b KV halves pool bytes. Was
        # 3047424: with the four decode graphs (1,4,8,32) that left no DRAM headroom and the
        # 131072-prompt benchmark points failed with Out of Memory on a 60 MB buffer
        # (2026-10-06 02:36, banks at 4.19 of 4.21 GB).
        GEMMA4_MAX_TOKENS_ALL_USERS: "2883584"
        GEMMA4_KV_BFP8: "1"
        GEMMA4_VLLM_SINGLE_CHUNK: "0"
        # Prefix caching needs vLLM-managed sliding KV (hybrid kv-cache groups), so the
        # bounded device rings stay off; chunked prefill stays untraced on this path.
        GEMMA4_HYBRID_KV_CACHE_GROUPS: "1"
        GEMMA4_BOUNDED_SLIDING_KV_CACHE: "0"
        GEMMA4_PREFIX_CACHING: "1"
        GEMMA4_CHUNKED_PREFILL_TRACE: "0"
      override_tt_config:
        fabric_config: FABRIC_1D
        trace_region_size: 512000000
        l1_small_size: 24576  # all_gather semaphores into L1_SMALL (metal demo parity)
        # On-device decode sampling required on TP so token ids >= 65536 are
        # reachable (host sampling only sees device 0's vocab shard).
        sample_on_device_mode: decode_only
      vllm_args:
        data_parallel_size: 4
        max_num_seqs: 32  # per-engine; max_concurrency above is whole-box
        # Overlap host schedule with device decode (metal supports_async_decode; #51186).
        async_scheduling: true
        enable-auto-tool-choice: true
        tool-call-parser: gemma4
        default-chat-template-kwargs: '{"enable_thinking": true}'
        reasoning-parser: gemma4
        enable_chunked_prefill: true
        # Under hybrid kv-cache groups vLLM charges each sliding group window + in-flight
        # tokens per request; 65536 could not fit one 256K request (56 GiB "needed").
        max_num_batched_tokens: 16384
        long_prefill_token_threshold: 4096
  status: COMPLETE
  has_builtin_warmup: true
  env_vars:
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
