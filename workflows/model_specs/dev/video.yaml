# MiniMax-H3 text-to-video-and-audio on one single-host Blackhole Galaxy (4x8 mesh, 32 chips,
# one worker, requests serialise). weights basename == tt-media-server ModelNames.MINIMAX_H3 ==
# the MODEL env the container receives; the full id keys models-ci-config.json, the eval config
# and the reference tables. FL2VA/Ref2VA are separate deployments (MODEL_RUNNER per task) and
# join once their runners are on main.
- weights:
    - MiniMaxAI/MiniMax-H3
  impl: tt_transformers
  # ~120 GB diffusers-modular snapshot (+ ~62 GB transformer_ref/ that `hf download` does not
  # exclude) + ~68 GB persistent ttnn cache built on first start.
  min_disk_gb: 300
  # infer_param_count() reads no size from this name; check_ram() needs an explicit number.
  min_ram_gb: 64
  model_type: VIDEO
  inference_engine: MEDIA
  env_vars:
    MODEL_RUNNER: tt-minimax-h3-t2va
    USE_ASYNC_VIDEO: "true"
    # One request in flight + one waiting; a queued request must not wait for hours.
    MAX_QUEUE_SIZE: "2"
    TT_DIT_CACHE_DIR: /home/container_app_user/cache_root/tt_dit_cache
    # Where setup_host puts the snapshot under --host-volume (weights/<model_name>). settings.py
    # adopts MODEL_WEIGHTS_DIR only when it is an existing non-empty directory; the pipeline
    # reads MINIMAX_H3_MODEL_PATH when the runner passes it no directory.
    MODEL_WEIGHTS_DIR: /home/container_app_user/cache_root/weights/MiniMax-H3
    MINIMAX_H3_MODEL_PATH: /home/container_app_user/cache_root/weights/MiniMax-H3
    # Compile the three 16:9 shapes the CI suites use at startup (4-16 min each) instead of
    # inside the first request of each shape; the readiness wait covers startup, test budgets
    # do not have to. Trim to "16:9@5" if startup time matters more than clean budgets.
    MINIMAX_H3_WARM_SHAPES: "16:9@5,16:9@10,16:9@15"
    # Line-cabled boxes: MINIMAX_H3_FABRIC_TOPOLOGY: linear (ring is the default and ~30% faster).
  device_model_specs:
    - device: BLACKHOLE_GALAXY
      max_concurrency: 1
      max_context: 65536
      default_impl: true
      env_vars:
        ARCH_NAME: blackhole
        MESH_DEVICE: "(4, 8)"
  status: FUNCTIONAL
