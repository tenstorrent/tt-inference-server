# MiniMax-H3 reference-to-video-and-audio (Ref2VA) on one single-host Blackhole Galaxy
# (4x8 mesh, 32 chips, one worker, requests serialise). DISPATCH-ONLY BRANCH zni/h3-ci-ref2va:
# t2va, fl2va and ref2va are separate deployments (MODEL_RUNNER per task) of the same weights,
# and this branch points the one MiniMaxAI/MiniMax-H3 BLACKHOLE_GALAXY spec at the Ref2VA runner
# so tt-shield on-dispatch runs every REF2VA / SIZE case by this branch's sha
# (docs/minimax_h3_ci.md, "Per-task dispatch branches"). Do not merge it as is: main's spec
# serves t2va.
# weights basename == tt-media-server ModelNames.MINIMAX_H3 == the MODEL env the container
# receives; the full id keys models-ci-config.json, the eval config and the reference tables.
- weights:
    - MiniMaxAI/MiniMax-H3
  impl: tt_transformers
  # The HF repo is 498.5 GB in total (FL2VA 144.1, Ref2VA 144.1, text_encoder 66.7,
  # transformer 66.3, transformer_ref 66.3, vae 10.4, audio_vae 0.6 GB; public HF API,
  # 2026-09-23). The Ref2VA runner reads transformer_ref/ INSTEAD of transformer/ (the repo's
  # Ref2VA/ folder is never read), so setup_host excludes FL2VA/, Ref2VA/, transformer/, assets/,
  # docs/ and scripts/ (HF_DOWNLOAD_EXTRA_EXCLUDES, keyed by MODEL_RUNNER): ~144 GB on a cold
  # volume. t2va/fl2va share the host volume (same model name), so a volume they warmed only
  # lacks transformer_ref/ (66.3 GB), which setup_host's per-task required paths detect and fetch.
  # The shared volume then holds ~210 GB of weights plus one ttnn cache per task and metal.
  min_disk_gb: 450
  # infer_param_count() reads no size from this name; check_ram() needs an explicit number.
  min_ram_gb: 64
  model_type: VIDEO
  inference_engine: MEDIA
  env_vars:
    MODEL_RUNNER: tt-minimax-h3-ref2va
    USE_ASYNC_VIDEO: "true"
    # One request in flight + one waiting; a queued request must not wait for hours.
    MAX_QUEUE_SIZE: "2"
    # ttnn cache keys do not include the tt-metal sha, and tt-metal 816841ddc93 (the first with
    # the minimax_h3 policy module these runners import) rewrote the VAE: a fresh directory keeps
    # entries cached by the older t2va image on the shared volume from being reused.
    TT_DIT_CACHE_DIR: /home/container_app_user/cache_root/tt_dit_cache_816841
    # Weights. Under --host-volume setup_host downloads the snapshot to <volume>/weights/MiniMax-H3
    # and nothing sets MODEL_WEIGHTS_DIR, so the runner passes the pipeline no directory and the
    # pipeline reads this path (tt-metal pipeline_minimax_h3.py). Under --host-weights-dir /
    # --host-hf-cache run_docker_server sets MODEL_WEIGHTS_DIR to the read-only mount and the
    # runner uses that instead. Do not set MODEL_WEIGHTS_DIR here: spec env overrides the mount value.
    MINIMAX_H3_MODEL_PATH: /home/container_app_user/cache_root/weights/MiniMax-H3
    # Warmup is create_pipeline(warmup=True): one 3-step 16:9 / 5 s generation with one
    # reference image, inside run.py's readiness wait (TT_SERVER_READY_TIMEOUT_SECONDS=3600 per
    # boot attempt x TT_SERVER_BOOT_ATTEMPTS=2). The video / audio reference encoders and the
    # 10 s / 15 s shapes compile inside their first request (SMOKE-REF2VA budget 2400 s), which
    # the benchmark's BH1X budgets and each case's warmup run absorb.
  device_model_specs:
    - device: BLACKHOLE_GALAXY
      max_concurrency: 1
      max_context: 65536
      default_impl: true
      env_vars:
        ARCH_NAME: blackhole
        MESH_DEVICE: "(4, 8)"
  status: FUNCTIONAL
