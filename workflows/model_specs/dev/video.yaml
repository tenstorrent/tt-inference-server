# MiniMax-H3 text-to-video-and-audio (T2VA) on one single-host Blackhole Galaxy or Wormhole
# Galaxy (4x8 mesh, 32 chips, one worker, requests serialise). DISPATCH-ONLY BRANCH
# zni/h3-ci-wh-galaxy (PR #5251, the Wormhole bring-up, plus zni/h3-ci-t2va): t2va, fl2va
# and ref2va are separate deployments (MODEL_RUNNER per task) of the same weights; this branch
# serves t2va with the sadesoye FL2VA/Ref2VA server merged in (its runner is the one that works
# on tt-metal >= 816841ddc93), so tt-shield on-dispatch runs every T2VA case by this branch's
# sha (docs/minimax_h3_ci.md, "Per-task dispatch branches").
# weights basename == tt-media-server ModelNames.MINIMAX_H3 == the MODEL env the container
# receives; the full id keys models-ci-config.json, the eval config and the reference tables.
- weights:
    - MiniMaxAI/MiniMax-H3
  impl: tt_transformers
  # The HF repo is 498.5 GB in total (FL2VA 144.1, Ref2VA 144.1, text_encoder 66.7,
  # transformer 66.3, transformer_ref 66.3, vae 10.4, audio_vae 0.6 GB; public HF API,
  # 2026-09-23). setup_host excludes FL2VA/, Ref2VA/, transformer_ref/, assets/, docs/ and
  # scripts/ (HF_DOWNLOAD_EXTRA_EXCLUDES), so ~144 GB lands on disk, plus the ~68 GB
  # persistent ttnn cache built on first start.
  min_disk_gb: 300
  # infer_param_count() reads no size from this name; check_ram() needs an explicit number.
  min_ram_gb: 64
  model_type: VIDEO
  inference_engine: MEDIA
  env_vars:
    MODEL_RUNNER: tt-minimax-h3-t2va
    USE_ASYNC_VIDEO: "true"
    # One request in flight + one waiting; a queued request must not wait for hours.
    MAX_QUEUE_SIZE: "2"
    # ttnn cache keys include neither the tt-metal sha nor the task, and tt-metal's robustness
    # line (sadesoye/minimax_robustness) changes cached tensors (padded context embedder /
    # refiner): one fresh directory per metal line and task keeps the three variants, which run
    # at once on the shared volume, from reusing or co-writing each other's entries.
    TT_DIT_CACHE_DIR: /home/container_app_user/cache_root/tt_dit_cache_robust_t2va
    # Weights. Under --host-volume setup_host downloads the snapshot to <volume>/weights/MiniMax-H3
    # and nothing sets MODEL_WEIGHTS_DIR, so the runner passes the pipeline no directory and the
    # pipeline reads this path (tt-metal pipeline_minimax_h3.py). Under --host-weights-dir /
    # --host-hf-cache run_docker_server sets MODEL_WEIGHTS_DIR to the read-only mount and the
    # runner uses that instead. Do not set MODEL_WEIGHTS_DIR here: spec env overrides the mount value.
    MINIMAX_H3_MODEL_PATH: /home/container_app_user/cache_root/weights/MiniMax-H3
    # Warmup is create_pipeline(warmup=True) inside run.py's readiness wait
    # (TT_SERVER_READY_TIMEOUT_SECONDS=3600 per boot attempt x TT_SERVER_BOOT_ATTEMPTS=2). The
    # 10 s / 15 s shapes compile inside their first request, which the benchmark's BH1X budgets
    # and each case's warmup run absorb.
  device_model_specs:
    - device: BLACKHOLE_GALAXY
      max_concurrency: 1
      max_context: 65536
      default_impl: true
      env_vars:
        ARCH_NAME: blackhole
        MESH_DEVICE: "(4, 8)"
    # Wormhole Galaxy (tt-shield GALAXY -> runner label 6u, type galaxy). tt-metal's
    # _PRESETS_WH[(4, 8)]: 4 links, Ring, DiT FSDP, stages not co-resident (12 GB of DRAM per
    # chip against Blackhole's 32 GB); the runner opens WH meshes with l1_small 32768 and a 4 KB
    # fabric payload (PR #5251). Needs a tt-metal that has _PRESETS_WH (main has it; the
    # sadesoye/minimax_robustness line so far keys every shape on the Blackhole table).
    - device: GALAXY
      max_concurrency: 1
      max_context: 65536
      default_impl: true
      env_vars:
        ARCH_NAME: wormhole_b0
        MESH_DEVICE: "(4, 8)"
        # Wormhole caches differ from Blackhole ones and the volume may be shared.
        TT_DIT_CACHE_DIR: /home/container_app_user/cache_root/tt_dit_cache_wh_t2va
  status: FUNCTIONAL
