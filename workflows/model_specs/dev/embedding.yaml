        MAX_BATCH_SIZE: "1"
        DEFAULT_THROTTLE_LEVEL: "0"
    - device: BLACKHOLE_GALAXY
      max_concurrency: 256   # GLOBAL batch, split across 32 replicas = 8/chip
      expected_ready_workers: 1
      max_context: 65536  # 64 * 1024
      default_impl: true
      env_vars:
        MODEL_RUNNER: "vllmforge_qwen_embedding"
