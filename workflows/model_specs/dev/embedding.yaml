        MAX_BATCH_SIZE: "32"
        ENABLE_DATA_PARALLEL: "true"
        USE_DYNAMIC_BATCHER: "false"
        DEFAULT_THROTTLE_LEVEL: "0"
        TT_METAL_INSPECTOR_RPC: "0"

