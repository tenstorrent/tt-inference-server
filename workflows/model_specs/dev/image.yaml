- weights:
    - MiniMaxAI/MiniMax-H3-Image
  model_display_name: MiniMax-H3-Image
  impl: tt_transformers
  # ~64 GB release snapshot, MiniMax-H3's 63 GB Qwen3-VL text encoder (H3-Image ships none), and the converted
  # copy the runner writes on first start, plus the ttnn cache.
  min_disk_gb: 260
  min_ram_gb: 64
  model_type: IMAGE
  inference_engine: MEDIA
  hf_weights_repo: MiniMaxAI/MiniMax-H3-Image
  env_vars:
    MODEL_RUNNER: tt-minimax-h3-image
    TT_DIT_CACHE_DIR: /home/container_app_user/cache_root/tt_dit_cache
    # The release snapshot; the runner converts it once into cache_root/MiniMax-H3-Image-converted.
    MINIMAX_H3_IMAGE_MODEL_PATH: /home/container_app_user/cache_root/weights/MiniMax-H3-Image
    TT_METAL_FABRIC_ROUTER_SYNC_TIMEOUT_MS: "120000"
  metadata:
    MiniMaxAI/MiniMax-H3-Image:
      hf_required_globs:
        - "pdd_config.json"
        - "pdd_fused_heads.safetensors"
        - "transformer/*.safetensors"
        - "vae/*"
        - "tokenizer/*"
        - "processor/*"
      # H3-Image conditions on MiniMax-H3's text encoder; fetched into <weights>/text_encoder/.
      hf_extra_files:
        - repo: MiniMaxAI/MiniMax-H3
          filename: text_encoder/chat_template.json
          local_subdir: "."
        - repo: MiniMaxAI/MiniMax-H3
          filename: text_encoder/config.json
          local_subdir: "."
        - repo: MiniMaxAI/MiniMax-H3
          filename: text_encoder/merges.txt
          local_subdir: "."
        - repo: MiniMaxAI/MiniMax-H3
          filename: text_encoder/model-00001-of-00014.safetensors
          local_subdir: "."
        - repo: MiniMaxAI/MiniMax-H3
          filename: text_encoder/model-00002-of-00014.safetensors
          local_subdir: "."
        - repo: MiniMaxAI/MiniMax-H3
          filename: text_encoder/model-00003-of-00014.safetensors
          local_subdir: "."
        - repo: MiniMaxAI/MiniMax-H3
          filename: text_encoder/model-00004-of-00014.safetensors
          local_subdir: "."
        - repo: MiniMaxAI/MiniMax-H3
          filename: text_encoder/model-00005-of-00014.safetensors
          local_subdir: "."
        - repo: MiniMaxAI/MiniMax-H3
          filename: text_encoder/model-00006-of-00014.safetensors
          local_subdir: "."
        - repo: MiniMaxAI/MiniMax-H3
          filename: text_encoder/model-00007-of-00014.safetensors
          local_subdir: "."
        - repo: MiniMaxAI/MiniMax-H3
          filename: text_encoder/model-00008-of-00014.safetensors
          local_subdir: "."
        - repo: MiniMaxAI/MiniMax-H3
          filename: text_encoder/model-00009-of-00014.safetensors
          local_subdir: "."
        - repo: MiniMaxAI/MiniMax-H3
          filename: text_encoder/model-00010-of-00014.safetensors
          local_subdir: "."
        - repo: MiniMaxAI/MiniMax-H3
          filename: text_encoder/model-00011-of-00014.safetensors
          local_subdir: "."
        - repo: MiniMaxAI/MiniMax-H3
          filename: text_encoder/model-00012-of-00014.safetensors
          local_subdir: "."
        - repo: MiniMaxAI/MiniMax-H3
          filename: text_encoder/model-00013-of-00014.safetensors
          local_subdir: "."
        - repo: MiniMaxAI/MiniMax-H3
          filename: text_encoder/model-00014-of-00014.safetensors
          local_subdir: "."
        - repo: MiniMaxAI/MiniMax-H3
          filename: text_encoder/model.safetensors.index.json
          local_subdir: "."
        - repo: MiniMaxAI/MiniMax-H3
          filename: text_encoder/preprocessor_config.json
          local_subdir: "."
        - repo: MiniMaxAI/MiniMax-H3
          filename: text_encoder/tokenizer.json
          local_subdir: "."
        - repo: MiniMaxAI/MiniMax-H3
          filename: text_encoder/tokenizer_config.json
          local_subdir: "."
        - repo: MiniMaxAI/MiniMax-H3
          filename: text_encoder/video_preprocessor_config.json
          local_subdir: "."
        - repo: MiniMaxAI/MiniMax-H3
          filename: text_encoder/vocab.json
          local_subdir: "."
  device_model_specs:
    - device: BLACKHOLE_GALAXY
      max_concurrency: 1
      max_context: 65536
      default_impl: true
      env_vars:
        ARCH_NAME: blackhole
        MESH_DEVICE: "(4, 8)"
  status: EXPERIMENTAL

