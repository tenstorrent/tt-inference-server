# FLUX.2 klein 4B through the generations API (TTFlux2Klein4BRunner): text to
# image and edits with up to 4 input images, 4 steps. Needs tt-metal main's
# flux2 pipeline, with image inputs. Disk and RAM are estimates.
- weights:
    - black-forest-labs/FLUX.2-klein-4B
  impl: tt_transformers
  min_disk_gb: 40
  min_ram_gb: 48
  model_type: IMAGE
  inference_engine: MEDIA
  env_vars:
    TT_DIT_CACHE_DIR: /home/container_app_user/cache_root/tt_dit_cache
  device_model_specs:
    - device: BLACKHOLE_GALAXY
      max_concurrency: 1
      max_context: 65536  # 64 * 1024
      default_impl: true
      known_issues:
      - workflow_type: SPEC_TESTS
        task_name: shape_16x9_1K
        reason: 'The server serves only 1:1 (Flux2klein4bRequest), so the API''s other aspect ratios are refused with 422.'
      - workflow_type: SPEC_TESTS
        task_name: shape_9x16_1K
        reason: 'The server serves only 1:1 (Flux2klein4bRequest), so the API''s other aspect ratios are refused with 422.'
      - workflow_type: SPEC_TESTS
        task_name: shape_4x3_1K
        reason: 'The server serves only 1:1 (Flux2klein4bRequest), so the API''s other aspect ratios are refused with 422.'
      - workflow_type: SPEC_TESTS
        task_name: shape_3x4_1K
        reason: 'The server serves only 1:1 (Flux2klein4bRequest), so the API''s other aspect ratios are refused with 422.'
      - workflow_type: SPEC_TESTS
        task_name: shape_3x2_1K
        reason: 'The server serves only 1:1 (Flux2klein4bRequest), so the API''s other aspect ratios are refused with 422.'
      - workflow_type: SPEC_TESTS
        task_name: shape_2x3_1K
        reason: 'The server serves only 1:1 (Flux2klein4bRequest), so the API''s other aspect ratios are refused with 422.'
      - workflow_type: SPEC_TESTS
        task_name: shape_16x9_2K
        reason: 'The server serves only 1:1 (Flux2klein4bRequest), so the API''s other aspect ratios are refused with 422.'
      - workflow_type: SPEC_TESTS
        task_name: shape_9x16_2K
        reason: 'The server serves only 1:1 (Flux2klein4bRequest), so the API''s other aspect ratios are refused with 422.'
      - workflow_type: SPEC_TESTS
        task_name: shape_4x3_2K
        reason: 'The server serves only 1:1 (Flux2klein4bRequest), so the API''s other aspect ratios are refused with 422.'
      - workflow_type: SPEC_TESTS
        task_name: shape_3x4_2K
        reason: 'The server serves only 1:1 (Flux2klein4bRequest), so the API''s other aspect ratios are refused with 422.'
      - workflow_type: SPEC_TESTS
        task_name: shape_3x2_2K
        reason: 'The server serves only 1:1 (Flux2klein4bRequest), so the API''s other aspect ratios are refused with 422.'
      - workflow_type: SPEC_TESTS
        task_name: shape_2x3_2K
        reason: 'The server serves only 1:1 (Flux2klein4bRequest), so the API''s other aspect ratios are refused with 422.'
      - workflow_type: SPEC_TESTS
        task_name: edit_one_image
        reason: 'The server serves only 1:1, so an edit without aspect_ratio comes back 1:1, not at the ratio of its input image as the API defaults it.'
      - workflow_type: SPEC_TESTS
        task_name: edit_near_limit_image
        reason: 'The server serves only 1:1, so an edit without aspect_ratio comes back 1:1, not at the ratio of its input image as the API defaults it.'
      - workflow_type: SPEC_TESTS
        task_name: edit_most_images
        reason: 'The server takes at most 1 input image (Flux2klein4bRequest), not the API''s 4, so the most-images edit is refused with 422.'
      - workflow_type: SPEC_TESTS
        task_name: cancel_running_job
        reason: 'A 1K image takes about 2 s, the same as the test''s 2 s poll, so the job completes before the test sees it running and can cancel it.'
  status: EXPERIMENTAL

# FLUX 3 Image klein through the generations API (TTFlux3ImageKleinRunner): the
# distilled model, eager, every prompt rewritten by its upsampler
# (black-forest-labs/flux-3-image-klein-pup, which the pipeline fetches itself);
# 1:1 at 1K, 2K and 4K with no reference or one. Needs tt-metal's flux3_klein
# pipeline with the upsampler, not on main: branch nwoodall/flux3-klein-pup
# (tenstorrent/tt-metal#64162, on #64101). Disk:
# the repo without the diffusers transformer (21 GB) on the host and again in
# the container's HF cache, the upsampler (19 GB) and the tt_dit caches.
- weights:
    - black-forest-labs/flux-3-image-klein
  impl: tt_transformers
  min_disk_gb: 150
  min_ram_gb: 64
  model_type: IMAGE
  inference_engine: MEDIA
  env_vars:
    MODEL_RUNNER: tt-flux-3-image-klein
    TT_DIT_CACHE_DIR: /home/container_app_user/cache_root/tt_dit_cache
  metadata:
    black-forest-labs/flux-3-image-klein:
      hf_download_excludes:
        - "transformer/*"
        - "variants/*"
        - "assets/*"
        - "*.jpg"
  device_model_specs:
    - device: BLACKHOLE_GALAXY
      max_concurrency: 1
      max_context: 65536  # 64 * 1024
      default_impl: true
  status: EXPERIMENTAL

# Ideogram 4 through the generations API (TTIdeogram4Runner), from the fp8
# checkpoint, dequantized to bf16 on the host. Needs tt-metal main's ideogram4
# pipeline from tenstorrent/tt-metal#63894 on, which sets the 128 MB trace
# region the runner reserves on a 4x8 mesh. Disk and RAM are
# estimates: the fp8 checkpoint plus the bf16 cache the pipeline writes next to it.
- weights:
    - ideogram-ai/ideogram-4
  impl: tt_transformers
  min_disk_gb: 120
  min_ram_gb: 96
  model_type: IMAGE
  inference_engine: MEDIA
  hf_weights_repo: ideogram-ai/ideogram-4-fp8
  env_vars:
    TT_DIT_CACHE_DIR: /home/container_app_user/cache_root/tt_dit_cache
  device_model_specs:
    - device: BLACKHOLE_GALAXY
      max_concurrency: 1
      max_context: 65536  # 64 * 1024
      default_impl: true
      # The spec tests run Ideogram 4 at 2K only (test_suites/image.json
      # sizes target): the server serves no 1K.
      known_issues:
      - workflow_type: SPEC_TESTS
        task_name: shape_4x3_2K
        reason: 'The server serves only 1:1, 16:9, 9:16 and 2:3, so the API''s 4:3 is refused with 422.'
      - workflow_type: SPEC_TESTS
        task_name: shape_3x4_2K
        reason: 'The server serves only 1:1, 16:9, 9:16 and 2:3, so the API''s 3:4 is refused with 422.'
      - workflow_type: SPEC_TESTS
        task_name: shape_3x2_2K
        reason: 'The server serves only 1:1, 16:9, 9:16 and 2:3, so the API''s 3:2 is refused with 422.'
  status: EXPERIMENTAL

