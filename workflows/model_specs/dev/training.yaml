# Model spec catalog: Training templates.
# Edit this file to add or modify a Training model spec.
# Schema: workflows/model_spec.py (ModelSpecTemplate, DeviceModelSpec).
# Dev entries carry no release pins (version / tt_metal_commit / docker_image);
# the launch image is supplied at runtime (e.g. --override_docker_image).
templates:
# =============================================================================
# Training templates
# =============================================================================
- weights:
    - google/gemma-1.1-2b-it
  impl: training_lora
  model_type: TRAINING
  inference_engine: FORGE
  status: EXPERIMENTAL
  uses_tensor_model_cache: false
  env_vars:
    MODEL_RUNNER: "training-lora"
    TRAINING_MODEL: "gemma-1.1-2b-it"
    ENABLE_JOB_PERSISTENCE: true
    JOB_CLEANUP_INTERVAL_SECONDS: 10000
    JOB_MAX_STUCK_TIME_SECONDS: 100000
    REQUEST_PROCESSING_TIMEOUT_SECONDS: 100000
  device_model_specs:
    - device: P150
      max_concurrency: 1
      max_context: 1024
    - device: P300
      max_concurrency: 1
      max_context: 1024
- weights:
    - meta-llama/Llama-3.1-8B
  impl: training_lora
  model_type: TRAINING
  inference_engine: FORGE
  status: EXPERIMENTAL
  uses_tensor_model_cache: false
  env_vars:
    MODEL_RUNNER: "training-lora"
    TRAINING_MODEL: "Llama-3.1-8B"
    ENABLE_JOB_PERSISTENCE: true
    JOB_CLEANUP_INTERVAL_SECONDS: 10000
    JOB_MAX_STUCK_TIME_SECONDS: 100000
    REQUEST_PROCESSING_TIMEOUT_SECONDS: 100000
  device_model_specs:
    - device: P150
      max_concurrency: 1
      max_context: 1024
    - device: P300
      max_concurrency: 1
      max_context: 1024
# tt-blacksmith-backed LoRA runner (LoraLLMTrainer). Selected by the training
# CI workflow via `--impl trainer-training-lora`; the `--workflow training_tests`
# driver submits a job to this runner and asserts its loss trajectory.
- weights:
    - meta-llama/Llama-3.1-8B
  impl: trainer_training_lora
  model_type: TRAINING
  inference_engine: FORGE
  status: EXPERIMENTAL
  uses_tensor_model_cache: false
  env_vars:
    MODEL_RUNNER: "trainer-training-lora"
    TRAINING_MODEL: "Llama-3.1-8B"
    ENABLE_JOB_PERSISTENCE: true
    JOB_CLEANUP_INTERVAL_SECONDS: 10000
    JOB_MAX_STUCK_TIME_SECONDS: 100000
    REQUEST_PROCESSING_TIMEOUT_SECONDS: 100000
  device_model_specs:
    - device: P150
      max_concurrency: 1
      max_context: 1024
    - device: P300
      max_concurrency: 1
      max_context: 1024
