# Model spec catalog: VLM templates.
# Edit this file to add or modify a VLM model spec.
# Schema: workflows/model_spec.py (ModelSpecTemplate, DeviceModelSpec).
templates:
# =============================================================================
# VLM templates
# =============================================================================
- weights:
    - google/gemma-3-4b-it
    - google/medgemma-4b-it
  impl: tt_transformers
  inference_engine: VLLM
  device_model_specs:
    - device: N150
      max_concurrency: 32
      max_context: 131072  # 128 * 1024
      default_impl: true
      vllm_args:
        limit-mm-per-prompt: '{"image": 10}'
        mm-processor-cache-gb: 0
      override_tt_config:
        l1_small_size: 4096
        fabric_config: FABRIC_1D
    - device: N300
      max_concurrency: 32
      max_context: 131072  # 128 * 1024
      default_impl: true
      vllm_args:
        limit-mm-per-prompt: '{"image": 10}'
        mm-processor-cache-gb: 0
      override_tt_config:
        l1_small_size: 4096
        fabric_config: FABRIC_1D
    - device: T3K
      max_concurrency: 32
      max_context: 131072  # 128 * 1024
      default_impl: true
      vllm_args:
        limit-mm-per-prompt: '{"image": 10}'
        data_parallel_size: 8
        mm-processor-cache-gb: 0
      override_tt_config:
        l1_small_size: 4096
        fabric_config: FABRIC_1D
    - device: P150
      max_concurrency: 32
      max_context: 131072  # 128 * 1024
      default_impl: true
      vllm_args:
        limit-mm-per-prompt: '{"image": 10}'
        mm-processor-cache-gb: 0
      override_tt_config:
        l1_small_size: 4096
        fabric_config: FABRIC_1D
  model_type: VLM
  status: EXPERIMENTAL
  supported_modalities:
    - text
    - image
  has_builtin_warmup: true

