      override_tt_config:
        l1_small_size: 4096
        fabric_config: FABRIC_1D
    - device: T3K
      max_concurrency: 32
      max_context: 131072  # 128 * 1024
      default_impl: true
      vllm_args:
        limit-mm-per-prompt: '{"image": 10}'
        data_parallel_size: 8
        mm-processor-cache-gb: 0
      override_tt_config:
        l1_small_size: 4096
        fabric_config: FABRIC_1D
    - device: P150
