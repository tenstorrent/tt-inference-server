# DeepSeek-V4.1-Flash, vision profile (model_type VLM: selects the vision eval tasks) on Blackhole Galaxy (32x P150, (4,8) mesh). Same tt-metal package and the same production
# settings as the text entry in dev/llm.yaml (16 users, 262,144 tokens, k=5, prefix caching on, paged prefill, chunked prefill budget 67584, DSV41_VISION=1); select with `--impl deepseek-v41-flash-vlm`.
# Images: up to 16 per prompt (limit-mm-per-prompt), <= 1026 tokens each; chat content parts of type image_url (vllm_config/chat_template.jinja).
- weights:
    - deepseek-ai/DeepSeek-V4.1-Flash
  impl: deepseek_v41_flash_vlm
  inference_engine: VLLM
  model_type: VLM
  supported_modalities:
    - text
    - image
  device_model_specs:
    - device: BLACKHOLE_GALAXY
      max_concurrency: 16  # 16 users: 4 mesh rows x 4 users per row
      max_context: 262144  # per request (prompt + output) = max_model_len
      default_impl: false
      tensor_cache_timeout: 7200.0
      env_vars:
        HF_MODEL: deepseek-ai/DeepSeek-V4.1-Flash
        MESH_DEVICE: "(4, 8)"
        DSV41_LAYERS: "0-39"
        DSV41_ENGRAM_RAM: "1"
        DSV41_POOL_DTYPE: fp8
        DSV41_TRACE_REGION: "800000000"
        DSV41_CKPT: /ckpt  # container path: mount the DeepSeek-V4.1-Flash-1017 HF checkpoint (deepseek-ai/DeepSeek-V4.1-Flash-1017) at /ckpt (read-only)
        DSV41_WEIGHT_CACHE: /cache/weights  # container path: mount a host-local NVMe dir at /cache (weights/ unified/ kernels/), written by the first run; one dir per checkpoint (use .../tt-metal-cache/1017 for 1017; the weight cache is stamped with the checkpoint id and the server refuses a cache of another checkpoint)
        DSV41_UNIFIED_CACHE: /cache/unified
        TT_METAL_CACHE: /cache/kernels
        EXTRA_MODELS_DIR: ../../tt-metal/models/demos/blackhole
        DSV41_BUILD_SLOTS: "0"
        DSV41_VISION: "1"  # device vision tower + image-aware prefill
        DSV41_VLLM_CHUNK: "512"  # prefill chunk of the chunked prefill / prefix cache grid
        DSV41_SPEC_MAX_CTX: "262144"
        DSV41_APC: "1"  # model-owned automatic prefix caching (needs enable-prefix-caching below)
        DSV41_PF_PAGED: read  # paged prefill; read mode forces a bf16 KV pool (APC needs it; DSV41_PF_PAGED=0 = previous dense-table prefill with the fp8 pool)
      vllm_args:
        block_size: "128"  # the DSV4.1 paged pool uses 128-token pages
        hf_config_path: ../../tt-metal/models/demos/blackhole/deepseek_v41_flash/vllm_config
        tokenizer: /ckpt
        chat-template-content-format: openai  # image_url content parts (the DeepSeek-V4.1 renderer of tokenizer-mode deepseek_v41 does the chat formatting; vllm_config/chat_template.jinja is no longer passed)
        max_num_seqs: "16"
        max_model_len: "262144"
        max_num_batched_tokens: "67584"  # chunked prefill token budget per step: the ONE place to set it (67584 = effectively one large prefill, 4096 = real interleaving with decode; value with APC on to be decided after measurement)
        enable-prefix-caching: true  # APC on by default (with DSV41_APC=1 and DSV41_PF_PAGED=read above); --no-enable-prefix-caching turns it off
        limit-mm-per-prompt: '{"image": 16}'
        mm-processor-cache-gb: 0
        tokenizer-mode: deepseek_v41  # vLLM's DeepSeek-V4.1 renderer (chat prompt + tools + DSML), needed for tool calls
        enable-auto-tool-choice: true
        tool-call-parser: deepseek_v41  # DSML tool-call parser
        reasoning-parser: deepseek_v41  # thinking=true requests return the reasoning in the `reasoning` field, not in the content
        default-chat-template-kwargs: '{"thinking": false}'  # non-thinking chat by default (a request can override it)
        hf-overrides: '{"architectures":["TTDeepseekV41ForCausalLM"]}'
        speculative_config: '{"method": "custom_class", "model": "vllm_tt_plugin.model_owned_drafter", "num_speculative_tokens": 5}'
      override_tt_config:
        fabric_config: FABRIC_1D_RING
        l1_small_size: 16384
        trace_region_size: 800000000
        sample_on_device_mode: all
  status: EXPERIMENTAL
  has_builtin_warmup: true

# DeepSeek-V4.1-Flash vision profile, 4 users x 1,048,576 tokens; select with `--impl deepseek-v41-flash-vlm-1m`.
- weights:
    - deepseek-ai/DeepSeek-V4.1-Flash
  impl: deepseek_v41_flash_vlm_1m
  inference_engine: VLLM
  model_type: VLM
