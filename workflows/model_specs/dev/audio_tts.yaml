# Qwen3-TTS on the cpp_server backend (MODEL_RUNNER_TYPE=tt_qwen3_tts), one
# deployment per release; run_docker_server.py's _CPP_TTS_* tables route these
# names there. Guide: tt-media-server/cpp_server/docs/QWEN3_TTS.md
- weights:
    - Qwen/Qwen3-TTS-12Hz-1.7B-Base
  impl: qwen3_tts
  min_disk_gb: 15
  min_ram_gb: 8
  model_type: TEXT_TO_SPEECH
  inference_engine: MEDIA
  device_model_specs:
    - device: N150
      max_concurrency: 1
      max_context: 65536  # 64 * 1024
      default_impl: true
    - device: P150
      max_concurrency: 1
      max_context: 65536  # 64 * 1024
      default_impl: true
  status: EXPERIMENTAL

# Qwen3-TTS on vLLM-Omni (`vllm serve --omni`), PoC: the talker stage on one chip
# streams codec chunks to the Code2Wav stage on another. The deploy config, from the
# vllm-tt-plugin ref, sets each stage's engine arguments; the image needs Ubuntu 24.04
# (Python 3.12) for vLLM-Omni 0.30.0. tenstorrent/vllm-tt-plugin#180
- weights:
    - Qwen/Qwen3-TTS-12Hz-1.7B-Base
  impl: qwen3_tts
  min_disk_gb: 15
  min_ram_gb: 8
  model_type: TEXT_TO_SPEECH
  inference_engine: VLLM
  # Each stage captures its own traces as it starts.
  has_builtin_warmup: true
  device_model_specs:
    - device: GALAXY
      # Each stage batches up to 4 requests (max_num_seqs in the deploy config).
      max_concurrency: 4
      max_context: 2048  # the talker stage's max_model_len
      default_impl: true
      vllm_args:
        deploy-config: poc/qwen3-tts-omni/deploy/tt_qwen3_tts_4seqs.yaml
        trust-remote-code: true
        stage-init-timeout: "600"
        init-timeout: "900"
      env_vars:
        # Two chips of the Galaxy, each opened as an N150.
        TT_VISIBLE_DEVICES: "0,1"
        MESH_DEVICE: N150
  status: EXPERIMENTAL

