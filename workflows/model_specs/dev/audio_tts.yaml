# Model spec catalog: Audio / TTS templates.
# Edit this file to add or modify a Audio / TTS model spec.
# Schema: workflows/model_spec.py (ModelSpecTemplate, DeviceModelSpec).
templates:
# =============================================================================
# Audio / TTS templates
# =============================================================================
- weights:
    - openai/whisper-large-v3
    - distil-whisper/distil-large-v3
  impl: whisper
  min_disk_gb: 15
  min_ram_gb: 6
  model_type: AUDIO
  inference_engine: MEDIA
  device_model_specs:
    - device: N150
      max_concurrency: 1
      max_context: 65536  # 64 * 1024
      default_impl: true
    - device: N300
      max_concurrency: 1
      max_context: 65536  # 64 * 1024
      default_impl: true
    - device: GALAXY
      max_concurrency: 32
      max_context: 65536  # 64 * 1024
      default_impl: true
    - device: T3K
      max_concurrency: 4
      max_context: 65536  # 64 * 1024
      default_impl: true
  status: COMPLETE

- weights:
    - openai/whisper-large-v3
    - distil-whisper/distil-large-v3
