- weights:
    - resnet-50
  impl: tt_transformers
  min_disk_gb: 15
  min_ram_gb: 6
  model_type: CNN
  inference_engine: FORGE
  status: FUNCTIONAL
  device_model_specs:
    - device: N150
      max_concurrency: 1
      max_context: 65536  # 64 * 1024
      default_impl: true
    - device: N300
      max_concurrency: 1
      max_context: 65536  # 64 * 1024
      default_impl: true

