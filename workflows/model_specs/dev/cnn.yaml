- weights:
    - yolox_nano
  impl: tt_transformers
  min_disk_gb: 15
  min_ram_gb: 6
  model_type: CNN
  inference_engine: FORGE
  status: COMPLETE
  device_model_specs:
    - device: N150
      max_concurrency: 1
      max_context: 65536  # 64 * 1024
      default_impl: true
    - device: P150
      max_concurrency: 1
      max_context: 65536  # 64 * 1024
      default_impl: true
      env_vars:
        # A single chip on a p300 board reads as a CUSTOM cluster; tt-metal will not init without a descriptor.
        TT_MESH_GRAPH_DESC_PATH: "/home/container_app_user/app/server/venv-worker/lib/python3.12/site-packages/pjrt_plugin_tt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p150_mesh_graph_descriptor.textproto"
    - device: P300X2
      max_concurrency: 4
      max_context: 65536  # 64 * 1024
      default_impl: true
      env_vars:
        # 4 data-parallel workers, one single-chip die each; same CUSTOM-cluster case as P150.
        TT_MESH_GRAPH_DESC_PATH: "/home/container_app_user/app/server/venv-worker/lib/python3.12/site-packages/pjrt_plugin_tt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p150_mesh_graph_descriptor.textproto"

