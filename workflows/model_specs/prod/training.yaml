# Model spec catalog: Training templates.
# Do not edit manually. This file is updated through the automated release process.
# Schema: workflows/model_spec.py (ModelSpecTemplate, DeviceModelSpec).
# Training specs are currently dev-only (EXPERIMENTAL); no prod entries yet.
templates:
# =============================================================================
# Training templates
# =============================================================================
- weights:
    - meta-llama/Llama-3.1-8B
  version: "0.19.0"
  tt_metal_commit: "REPLACE_ME"
  docker_image: "tt-media-server-forge:local"
  impl: training_lora
  model_type: TRAINING
  inference_engine: FORGE
  status: EXPERIMENTAL
  uses_tensor_model_cache: false
  env_vars:
    MODEL_RUNNER: "trainer-training-lora"
    TRAINING_MODEL: "Llama-3.1-8B"
    ENABLE_JOB_PERSISTENCE: true
    JOB_CLEANUP_INTERVAL_SECONDS: 10000
    JOB_MAX_STUCK_TIME_SECONDS: 100000
    REQUEST_PROCESSING_TIMEOUT_SECONDS: 100000
  device_model_specs:
    - device: P150
      max_concurrency: 1
      max_context: 1024
    - device: P300
      max_concurrency: 1
      max_context: 1024
    - device: P300X2          # add this
      max_concurrency: 1
      max_context: 1024
