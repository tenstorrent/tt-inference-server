# ---------------------------------------------------------------------------
# Required at install time:
#   helm install my-model ./charts/tt-inference-server \
#     --set model="Llama-3.1-8B-Instruct" \
#     --set device=galaxy \
#     --set hfToken="hf_xxx"
#
# Optional:
#   --set engine=vllm       # pin engine when a model has multiple
#   --set impl=tt_transformers   # pin impl when a device has multiple
# ---------------------------------------------------------------------------

model: ""
device: ""
engine: ""
impl: ""
hfToken: ""

nameOverride: ""
fullnameOverride: ""

# Optional: override the cache host path (defaults to /opt/cache/<model>-<device>-<impl>)
cache:
  hostPath: ""

# Optional: pre-downloaded HuggingFace cache directory on the host. When set,
# it is mounted read-only at /mnt/hf-cache inside the container, and the
# MODEL_WEIGHTS_DIR (vLLM) and MODEL_WEIGHTS_PATH + DOWNLOAD_WEIGHTS_FROM_SERVICE
# (tt-media-server) env vars are set so each server picks up the name it reads.
hfCacheDir: ""

# Inference-route authentication. media and forge servers check a literal
# `Authorization: Bearer $API_KEY` (/health and /v1/models stay open) and fall
# back to a well-known built-in key when unset, so one of these two is required
# for those engines. vLLM is open unless VLLM_API_KEY is set.
auth:
  # Bearer key clients must send. Stored in the release Secret as API_KEY
  # (media/forge) or VLLM_API_KEY (vllm).
  apiKey: ""
  # Serve without authentication (NO_AUTH=1). media/forge only.
  disabled: false

# Tenstorrent boards need 1Gi hugepages unless the cluster runs IOMMU + KMD
# 1.29.0+, where they aren't required. When disabled, the chart drops the
# hugepages-1Gi request/limit, the /dev/hugepages-1G volume + mounts, and the
# cleanup-hugepages initContainer.
hugepages:
  enabled: true
  # Request/limit when enabled. Empty means one 1Gi page per ASIC of the chosen
  # device (deviceChipCounts) — e.g. 1Gi on an n150, 8Gi on a T3K.
  size: ""

# PodMonitor scraping the inference server's own /metrics (vLLM and media-server
# expose it). Disabled by default: a PodMonitor needs the Prometheus Operator
# CRDs (monitoring.coreos.com), and rendering one without them fails at install.
podMonitor:
  enabled: false
  # Labels added to the PodMonitor so your Prometheus's podMonitorSelector
  # matches it, or it won't be scraped. The default matches tt-telemetry's chart
  # and the kube-prometheus-stack convention (its podMonitorSelector defaults to
  # release: <the stack's own release name>). Override when your Prometheus was
  # installed under a different release name.
  labels:
    release: prometheus
  interval: 30s
  path: /metrics

# ---------------------------------------------------------------------------
# Defaults — merged with (and overridden by) per-model config below.
# ---------------------------------------------------------------------------
defaults:
  replicaCount: 1
  progressDeadlineSeconds: 3600
  # DRA: devices acquired via a ResourceClaim served by tt-operator's tt-dra-driver.
  # Board count comes from deviceBoardCounts (per device); only the DeviceClass
  # name is set here.
  dra:
    deviceClassName: tenstorrent.com
  # maxSurge=0 frees the outgoing Pod's board + hugepages before its replacement
  # starts; maxUnavailable=1 rolls one Pod at a time when replicaCount > 1.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  podAnnotations: {}
  podSecurityContext: {}
  image:
    pullPolicy: IfNotPresent
    pullSecrets: []
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
    annotations: {}
  # hugepages-1Gi is not listed here: it is sized from the device's ASIC count
  # (see hugepages.size).
  resources:
    limits:
#      cpu: "8"
#      memory: 480Gi #~90% of RAM available on Galaxy servers
    requests:
      cpu: "6"
      memory: 64Gi
  probes:
    # startupProbe owns the model compile/warmup window; while it runs the kubelet
    # suppresses liveness/readiness. Its failureThreshold is computed in the
    # Deployment as ceil(progressDeadlineSeconds / periodSeconds), so the budget
    # tracks the max compile time — no per-model initialDelaySeconds to hand-sync.
    # Always rendered (no enable toggle): disabling it would let liveness, whose
    # initialDelaySeconds defaults to 0, restart the container mid-compile.
    startup:
      periodSeconds: 15
    liveness:
      enabled: true
      path: /v1/models
    readiness:
      enabled: true
      path: /health
  nodeSelector: {}
  tolerations: []
  # User-supplied affinity, applied as-is. v0.2: the chart no longer injects a
  # 1:1-Pod-per-Node podAntiAffinity — DRA prevents device collisions by
  # allocation, so multiple Pods may run on one Node (e.g. 4 single-n300 Pods on
  # a T3K). Add your own nodeAffinity / podAffinity / podAntiAffinity here if
  # needed.
  affinity: {}
  extraEnv: []

# DRA boardName per device — the tt-dra-driver `boardName` attribute a ResourceClaim selects (CEL) for each device shape.
# Generated from workflows/device_utils.py:BOARD_TYPE_COUNT_TO_DEVICE; consumed by tt-inference-server.draBoardName.
deviceBoardNames:
  galaxy: galaxy-wormhole
  n150: n150
  n150x4: n150
  n300: n300
  p100: p100
  p150: p150
  p150x4: p150
  p150x8: p150
  p300: p300
  p300x2: p300
  t3k: n300

# ASIC count per device — tt-metal maps one 1Gi hugepage per ASIC, so this sizes the
# hugepages request/limit. Generated from workflows/device_utils.py:BOARD_TYPE_COUNT_TO_DEVICE;
# consumed by tt-inference-server.hugepagesSize.
deviceChipCounts:
  galaxy: 32
  n150: 1
  n150x4: 4
  n300: 2
  p100: 1
  p150: 1
  p150x4: 4
  p150x8: 8
  p300: 2
  p300x2: 4
  t3k: 8

# DRA board count per device — number of Tenstorrent boards a ResourceClaim requests for each device shape.
# Generated from workflows/device_utils.py:BOARD_TYPE_COUNT_TO_DEVICE; consumed by tt-inference-server.draDeviceCount.
deviceBoardCounts:
  galaxy: 32
  n150: 1
  n150x4: 4
  n300: 1
  p100: 1
  p150: 1
  p150x4: 4
  p150x8: 8
  p300: 1
  p300x2: 2
  t3k: 4

